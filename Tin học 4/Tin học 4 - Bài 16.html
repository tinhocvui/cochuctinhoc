function flowerSVG(x=445,y=215){return `<g transform="translate(${x} ${y})"><path d="M0 18 L0 85" stroke="#36996b" stroke-width="8"/><ellipse cx="-20" cy="46" rx="22" ry="10" transform="rotate(30 -20 46)" fill="#65c78c"/><ellipse cx="24" cy="62" rx="19" ry="9" transform="rotate(-29 24 62)" fill="#65c78c"/>${[0,60,120,180,240,300].map(a=>`<ellipse cx="0" cy="-22" rx="16" ry="25" fill="#f8a0af" transform="rotate(${a})"/>`).join('')}<circle r="20" fill="#ffd978" stroke="#edaa4c" stroke-width="3"/><circle cx="-6" cy="-4" r="2" fill="#745b45"/><circle cx="7" cy="-4" r="2" fill="#745b45"/><path d="M-5 6 Q0 11 6 6" fill="none" stroke="#745b45" stroke-width="2"/></g>`}
function stageSVG(kind='cat',phase='idle',x=0,words=''){
 const butterfly=kind==='butterfly';const color=butterfly?'#e4fbfa':'#e5eeff';const actor=butterfly?butterflySvg():catSvg(); const actorX=(butterfly?112:114)+x, actorY=butterfly?202:229; const move=phase==='move';
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 345" role="img" aria-label="Sân khấu minh họa ${butterfly?'bướm bay đến hoa':'mèo chào bạn'}"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#fffefa"/></linearGradient><linearGradient id="earth"><stop stop-color="#b9ebbe"/><stop offset="1" stop-color="#7bcea8"/></linearGradient></defs><rect width="610" height="345" rx="18" fill="url(#sky)"/><circle cx="505" cy="61" r="28" fill="#ffdf85" opacity=".8"/><path d="M0 257 Q100 220 206 253 T412 246 T610 238 L610 345 L0 345" fill="url(#earth)"/><path d="M0 305 Q150 292 290 312 T610 305" stroke="#56bba4" stroke-width="4" fill="none" opacity=".5"/><g fill="#fff" opacity=".9"><ellipse cx="110" cy="62" rx="40" ry="16"/><ellipse cx="84" cy="61" rx="26" ry="17"/><ellipse cx="141" cy="60" rx="20" ry="15"/><ellipse cx="331" cy="77" rx="40" ry="14"/><ellipse cx="308" cy="74" rx="21" ry="17"/></g>${[45,185,330,565].map((a,i)=>`<g transform="translate(${a} ${286+i%2*9})"><path d="M0 0 v18" stroke="#59945f" stroke-width="3"/><circle r="6" fill="${i%2?'#f997a3':'#ffd166'}"/></g>`).join('')}${butterfly?flowerSVG():`<g transform="translate(495 236)"><circle cx="0" cy="-38" r="21" fill="#ffdab6"/><path d="M-19 -45 Q0 -67 19 -44" fill="#655aa3"/><circle cx="-7" cy="-41" r="2.6" fill="#2b3953"/><circle cx="7" cy="-41" r="2.6" fill="#2b3953"/><path d="M-7 -31 Q0 -25 7 -31" stroke="#9d6460" stroke-width="2" fill="none"/><rect x="-23" y="-16" width="46" height="63" rx="16" fill="#8e79d6"/><path d="M-13 47 v25 M13 47 v25" stroke="#52627d" stroke-width="11" stroke-linecap="round"/><path d="M-21 0 l-19 27 M21 0 l18 23" stroke="#ffc9a9" stroke-width="11" stroke-linecap="round"/></g>`}<g id="storyActor" transform="translate(${actorX} ${actorY})" style="filter:drop-shadow(0 8px 4px #51666335)">${actor}</g>${words?`<g transform="translate(${Math.min(actorX+7,415)} ${actorY-128})"><rect x="0" y="0" width="166" height="53" rx="16" fill="white" stroke="#a69cdb" stroke-width="2"/><path d="M23 53 l-13 14 4-14" fill="white" stroke="#a69cdb" stroke-width="2"/><text x="83" y="32" font-size="15" font-weight="800" text-anchor="middle" fill="#5a438d">${escapeHTML(words)}</text></g>`:''}<g transform="translate(13 13)"><rect width="159" height="31" rx="10" fill="#ffffffda"/><text x="12" y="20" font-size="13" font-weight="800" fill="#3e5481">${move?'ĐANG DI CHUYỂN':phase==='say'?'ĐANG NÓI':phase==='wait'?'ĐANG ĐỢI':'SÂN KHẤU'}</text></g></svg>`
}
function previewSmall(kind){return `<div style="background:#f5faff;border-radius:14px;padding:4px">${stageSVG(kind,'idle',0,'')}</div>`}
const brandIcon=`<svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="3" width="44" height="42" rx="15" fill="#8069c6"/><rect x="7" y="8" width="34" height="24" rx="6" fill="#d9f7ef"/><path d="M18 17 L26 22 L18 27 Z" fill="#f78b4b"/><path d="M14 37 H34" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>`;
function header(){return `<header class="top"><div class="brand">${brandIcon}<div><span>NHÀ SÁNG TẠO SCRATCH NHÍ</span><small>${GAME_CONFIG.grade} · ${GAME_CONFIG.lesson}</small></div></div><div class="topright"><button id="musicToggle" class="sound" aria-pressed="${Audio.musicOn}"><b>♫</b> Nhạc nền: ${Audio.musicOn?'Bật':'Tắt'}</button><button id="sfxToggle" class="sound" aria-pressed="${Audio.sfxOn}"><b>♪</b> Hiệu ứng: ${Audio.sfxOn?'Bật':'Tắt'}</button></div></header>`}
function home(){return `${header()}<section class="hero"><div class="heroCopy"><span class="eyebrow">⭐ KHÁM PHÁ LẬP TRÌNH TRỰC QUAN</span><h1>NHÀ SÁNG TẠO<br><span>SCRATCH NHÍ</span></h1><p>Từ một ý tưởng nhỏ, em tự sắp xếp bước làm, ghép khối lệnh, điều khiển nhân vật rồi sửa và trưng bày sản phẩm sáng tạo của mình!</p><div class="buttonrow"><button class="btn main" data-action="start">▶ Bắt đầu khám phá</button><button class="btn purple" data-action="instructions">◈ Hướng dẫn</button></div><div class="stats"><div class="stat">4 nhiệm vụ</div><div class="stat">100 điểm</div><div class="stat">Không giới hạn thời gian</div></div><div class="panel" style="margin-top:17px;max-width:380px"><h3>Chọn chế độ</h3><div class="optgrid"><button class="opt ${S.mode==='practice'?'active':''}" data-mode="practice">🌿 Luyện tập<small>Có hướng dẫn gần hơn</small></button><button class="opt ${S.mode==='challenge'?'active':''}" data-mode="challenge">★ Thử thách<small>Tự khám phá trước</small></button></div></div></div><div class="heroVisual"><div class="tag">PHÒNG THÍ NGHIỆM SÁNG TẠO</div>${stageSVG('butterfly','say',112,'Chào bông hoa!')}<div style="display:flex;align-items:center;gap:12px;margin:8px 0 0">${glyphMay()}<div><b>Mây – nhà phát minh nhỏ</b><div class="tiny">“Từng khối lệnh sẽ làm nên câu chuyện của em!”</div></div></div></div></section>`}
function instructions(){return `${header()}<main class="how card"><h2>Hướng dẫn tham gia</h2><div class="introList"><div class="panel"><h3>1. Chọn ý tưởng</h3><p>Chọn Mèo hoặc Bướm, xác định đúng nhân vật, hành động và kết quả.</p></div><div class="panel"><h3>2. Lập sơ đồ</h3><p>Nhấn từng bước đúng thứ tự. Chạm bước vừa xếp để làm lại nếu cần.</p></div><div class="panel"><h3>3. Ghép khối và chạy</h3><p>Nhấn chọn khối → chọn ô đích, hoặc kéo khối tới ô. Nhấn cờ xanh để xem kết quả.</p></div><div class="panel"><h3>4. Sửa & trưng bày</h3><p>Thay giá trị lệnh chưa đúng, thử lại và lưu trong lượt chơi.</p></div></div><div class="guideBox">${glyphMay()}<p>Mỗi màn hoàn thành đúng được <b>25 điểm</b>. Sai được thử lại, không trừ điểm. Có nút <b>Gợi ý</b> hai mức. Không dùng giọng đọc. Dữ liệu chỉ giữ trong lượt chơi hiện tại.</p></div><div class="buttonrow"><button class="btn main" data-action="start">▶ Bắt đầu</button><button class="btn" data-action="home">← Trang chủ</button></div></main>`}
function bar(){return `<div class="bar card"><div class="navStages">${GAME_CONFIG.levels.map((o,i)=>`<button class="stepbtn ${S.level===i?'current':S.done[i]?'done':''}" data-jump="${i}" ${i>0&&!S.done[i-1]?'disabled':''} title="${escapeHTML(o.title)}">${S.done[i]?'✓':i+1}</button>`).join('')}</div><div class="status"><strong>Màn ${S.level+1}/4</strong><span class="score">★ ${score()}/100 điểm</span><span class="tag">${S.mode==='practice'?'Luyện tập':'Thử thách'}</span></div></div>`}
function feedbackHtml(){return `<div role="status" aria-live="polite" id="feedback" class="feedback ${S.feedbackType}">${S.feedback||'Hãy thao tác để Mây kiểm tra kết quả nhé!'}</div>`}
function progress(){let n=0,t=4;if(S.level===0)n=Number(!!S.story)+Object.values(S.l1).filter(Boolean).length;else if(S.level===1)n=S.plan.length;else if(S.level===2){n=S.placed.filter(Boolean).length+Number(S.runDone);t=5;}else n=Number(S.fix.distance===String(story().distance))+Number(S.fix.speech===story().speech)+Number(S.fix.wait==='1')+Number(S.runDone);return `<div class="progressbar" aria-label="Tiến độ"><i style="width:${n/t*100}%"></i></div>`}
function intro1(){let s=story();const opts={actor:['Mèo','Bướm','Cây xanh'],action:['Di chuyển đến bạn','Bay đến bông hoa','Nằm ngủ'],outcome:['Nói “Xin chào!”','Nói “Chào bông hoa!”','Không có lời nói']};let q=[['actor','Nhân vật nào sẽ làm việc?',s.actor],['action','Nhân vật cần làm gì?',s.action],['outcome','Kết quả cần nhìn thấy là gì?',s.outcome]];return `<div class="panel"><h3>① Chọn câu chuyện em muốn tạo</h3><div class="optgrid"><button class="opt ${S.story==='cat'?'active':''}" data-story="cat">${previewSmall('cat')}Mèo chào bạn</button><button class="opt ${S.story==='butterfly'?'active':''}" data-story="butterfly">${previewSmall('butterfly')}Bướm bay đến hoa</button></div></div>${S.story?`<div class="panel"><h3>② Xác định 3 tiêu chí để xây dựng câu chuyện</h3>${q.map(([key,label,answer])=>`<div class="question"><header>${S.l1[key]?'✓ ':''}${label}</header><div class="optgrid">${opts[key].map(choice=>`<button class="opt ${S.l1[key]&&choice===answer?'correct':''}" data-answer1="${key}" data-value="${escapeHTML(choice)}" ${S.l1[key]?'disabled':''}>${escapeHTML(choice)}</button>`).join('')}</div></div>`).join('')}</div>`:''}`}
function intro2(){return `<div class="panel"><h3>Nhấn lần lượt các bước để tạo sơ đồ</h3><div class="chipRow">${GAME_CONFIG.steps.map(st=>`<button class="chip ${S.plan.includes(st.id)?'used':''}" data-plan="${st.id}" ${S.plan.includes(st.id)?'disabled':''}>${escapeHTML(st.title)}</button>`).join('')}</div><div class="seq" aria-label="Trình tự đã chọn">${S.plan.length?S.plan.map((v,i)=>`<button class="item" style="border:0;min-height:44px" data-unplan="${i}" title="Nhấn để bỏ bước">${i+1}. ${escapeHTML(GAME_CONFIG.steps.find(st=>st.id===v).title)} ×</button>`).join(''):'<span class="placeholder">Các bước em chọn sẽ hiện ở đây…</span>'}</div><div class="tiny">Sau khi chương trình đợi xong, câu chuyện kết thúc. Không cần thêm khối “kết thúc”.</div></div>`}
function intro3(){return `<div class="panel"><h3>① Lấy khối từ bảng màu</h3><div class="blocks" id="palette">${GAME_CONFIG.blocks.map(b=>`<button class="block ${S.selected===b.id?'selected':''}" draggable="false" data-block="${b.id}" data-kind="${b.kind}" aria-pressed="${S.selected===b.id}">${escapeHTML(b.text)}</button>`).join('')}</div><p class="helpInline">${S.selected?'Đã chọn khối: '+GAME_CONFIG.blocks.find(b=>b.id===S.selected).text+'. Nhấn vào ô muốn đặt.':'Kéo khối tới ô trống, hoặc nhấn chọn khối rồi chọn ô đích.'}</p></div><div class="sim"><div class="simHead"><span>② Vùng chương trình (4 ô)</span><span>Không cần cài Scratch</span></div><div class="slots">${S.placed.map((id,i)=>`<div class="slot ${id?'filled':''}" tabindex="0" role="button" data-slot="${i}" aria-label="Vị trí ${i+1}, ${id?GAME_CONFIG.blocks.find(b=>b.id===id).text:'trống'}"><b>${i+1}</b><span>${id?escapeHTML(GAME_CONFIG.blocks.find(b=>b.id===id).text):'Đặt khối tại đây…'}</span>${id?`<button data-remove="${i}" title="Bỏ khối">×</button>`:''}</div>`).join('')}</div><button class="btn teal" data-action="run3" ${S.runActive?'disabled':''}>⚑ Chạy chương trình</button> <button class="btn soft" data-action="stopRun">■ Dừng</button></div>`}
function intro4(){return `<div class="panel"><h3>① Sửa ba điểm chưa đúng của chương trình</h3><div class="params"><label class="param">→ Số bước di chuyển<select id="fix-distance" data-fix="distance"><option value="0" ${S.fix.distance==='0'?'selected':''}>0 bước – chưa di chuyển</option><option value="60" ${S.fix.distance==='60'?'selected':''}>60 bước – còn xa đích</option><option value="100" ${S.fix.distance==='100'?'selected':''}>100 bước – mèo đến bạn</option><option value="120" ${S.fix.distance==='120'?'selected':''}>120 bước – bướm đến hoa</option></select></label><label class="param">▤ Lời nói<select id="fix-speech" data-fix="speech"><option value="Chào buổi tối!" ${S.fix.speech==='Chào buổi tối!'?'selected':''}>Chào buổi tối!</option><option value="Xin chào!" ${S.fix.speech==='Xin chào!'?'selected':''}>Xin chào!</option><option value="Chào bông hoa!" ${S.fix.speech==='Chào bông hoa!'?'selected':''}>Chào bông hoa!</option></select></label><label class="param">◷ Thời gian đợi<select id="fix-wait" data-fix="wait"><option value="0" ${S.fix.wait==='0'?'selected':''}>0 giây – lời chào biến mất</option><option value="1" ${S.fix.wait==='1'?'selected':''}>1 giây – đủ để đọc</option><option value="3" ${S.fix.wait==='3'?'selected':''}>3 giây – hơi lâu</option></select></label></div></div><div class="sim"><div class="simHead">② Kiểm tra sản phẩm theo tiêu chí</div><div class="tiny">${S.story==='cat'?'Mèo phải di chuyển 100 bước, nói “Xin chào!” và đợi 1 giây.':'Bướm phải bay 120 bước, nói “Chào bông hoa!” và đợi 1 giây.'}</div><div class="buttonrow"><button class="btn teal" data-action="run4" ${S.runActive?'disabled':''}>⚑ Chạy thử bản sửa</button><button class="btn soft" data-action="stopRun">■ Dừng</button></div>${S.runDone?`<div class="result"><h3>✓ Chương trình đạt 3 tiêu chí!</h3><p>Nhân vật đến đúng đích, hiển thị đúng lời chào và đợi đủ thời gian.</p></div><button class="btn main" data-action="saveProduct" ${S.saved?'disabled':''}>▣ ${S.saved?'Đã lưu trong lượt chơi':'Lưu sản phẩm'}</button>`:''}${S.saved?`<div class="gallery"><span class="badge">SẢN PHẨM CỦA EM</span><b style="display:block;margin-top:8px">${escapeHTML(story().name)}</b><div class="tiny">Lưu trong lượt chơi · Không phải tệp Scratch .sb3</div><button class="btn purple" data-action="replay">▶ Phát lại sản phẩm</button></div>`:''}</div>`}
function renderTask(){return [intro1,intro2,intro3,intro4][S.level]();}
function levelView(){let lv=GAME_CONFIG.levels[S.level];let mascotMood=S.feedbackType==='bad'?'sad':'happy';return `${header()}${bar()}<main class="layout"><section class="stageCard card"><div class="sceneTop"><strong>◈ Sân khấu sáng tạo</strong><span class="picturePill">${S.story?escapeHTML(story().name):'Chọn câu chuyện'}</span></div><div id="sceneViewport" class="scene">${stageSVG(S.story||'cat',S.visual.doing,S.visual.x,S.visual.speech)}</div><div class="sceneFooter"><span class="tiny">${S.runActive?'● Chương trình đang chạy…':S.runDone?'✓ Đã xem chương trình chạy':'◌ Chờ thao tác của em'}</span><span class="smallcap">MÔ PHỎNG PHỤC VỤ HỌC TẬP</span></div><div class="guideBox">${glyphMay(mascotMood)}<p><b>Mây mách nhỏ:</b> ${S.mode==='practice'?escapeHTML(lv.note):'Tự khám phá để hoàn thành nhiệm vụ. Em vẫn có thể mở Gợi ý khi cần.'}</p></div></section><section class="card task"><div class="smallcap">NHIỆM VỤ ${S.level+1} / 4</div><h2>${escapeHTML(lv.title)}</h2><p class="lead">${escapeHTML(lv.note)}</p>${progress()}<div id="taskContent">${renderTask()}</div>${S.hint>0?`<div class="hint">💡 Gợi ý ${S.hint}/2: ${escapeHTML(lv.hint[S.hint-1])}</div>`:''}${feedbackHtml()}<div class="footTools"><button class="btn soft" data-action="home">⌂ Trang chủ</button><button class="btn soft" data-action="hint" ${S.hint>=2?'disabled':''}>◈ Gợi ý ${S.hint}/2</button><button class="btn soft" data-action="resetLevel">↻ Làm lại màn</button><span class="spacer"></span><button class="btn main" data-action="next" ${!S.done[S.level]?'disabled':''}>${S.level===3?'Xem thành tích ★':'Tiếp tục →'}</button></div><p class="helpInline">${S.done[S.level]?'✓ Hoàn thành! 25 điểm của màn này đã được ghi nhận.':'Chỉ khi hoàn thành đúng nhiệm vụ, màn tiếp theo mới mở.'}</p></section></main>`}
function summary(){return `${header()}<main class="end card"><div style="font-size:36px">✦ ★ ✦</div><span class="eyebrow">HUY HIỆU NHÀ SÁNG TẠO</span><h1>Chúc mừng em hoàn thành!</h1><div class="endScore">${score()}<span style="font-size:24px">/100</span></div><p>Em đã sáng tạo một chương trình nhỏ từ ý tưởng đến sản phẩm chạy được.</p><div class="gallery"><span class="badge">TÁC PHẨM TRONG LƯỢT CHƠI</span><h2>${escapeHTML(story().name)}</h2><div style="max-width:550px;margin:auto">${stageSVG(S.story,'say',story().distance*(S.story==='butterfly'?2.65:3.55),story().speech)}</div><div class="buttonrow" style="justify-content:center"><button class="btn purple" data-action="replay">▶ Phát lại sản phẩm</button></div><p class="tiny">Giao diện mô phỏng phục vụ học tập. Chỉ giữ trong lượt chơi; không tạo tệp .sb3.</p></div><div class="bullet">✓ Em biết xác định nhân vật, hành động và kết quả của câu chuyện.</div><div class="bullet">✓ Em biết sắp xếp và ghép khối lệnh đúng trình tự.</div><div class="bullet">✓ Em biết chạy thử, tìm lỗi và điều chỉnh chương trình để đạt yêu cầu.</div><div class="buttonrow" style="justify-content:center"><button class="btn main" data-action="playAgain">↻ Chơi lại từ đầu</button><button class="btn" data-action="home">⌂ Trang chủ</button></div></main>`}
function render(){cancelRun();let content=S.screen==='home'?home():S.screen==='how'?instructions():S.screen==='summary'?summary():levelView();$('app').innerHTML=content+`<footer class="footer">Tin học 4 · Bài 16 · Giao diện Scratch mô phỏng phục vụ học tập · Không thu thập dữ liệu</footer>`;Audio.manage()}
function notify(text,type=''){S.feedback=text;S.feedbackType=type;const el=$('feedback');if(el){el.className='feedback '+type;el.textContent=text;}}
function refreshLevel(){let sc=S.screen;if(sc==='level'){const focusId=document.activeElement?.id;const scroll=window.scrollY;render();if(focusId&&$(focusId))$(focusId).focus({preventScroll:true});window.scrollTo(0,scroll)}}
function clearLevelFrom(index){for(let i=index;i<4;i++)S.done[i]=false;S.saved=null;S.story=index===0?null:S.story;S.runDone=false;S.visual={x:0,speech:'',doing:''};S.hint=0;S.feedback='';S.feedbackType='';S.selected=null;S.plan=[];S.placed=[null,null,null,null];S.fix={distance:'0',speech:'Chào buổi tối!',wait:'0'};S.l1={actor:false,action:false,outcome:false}}
function resetLevel(){clearLevelFrom(S.level);notify('Màn đã được đặt lại. Em có thể thử từ đầu nhé!');refreshLevel()}
function resetGame(){S.level=0;clearLevelFrom(0);S.screen='level';Audio.activate();render()}
function complete(){if(S.done[S.level])return;S.done[S.level]=true;S.selected=null;notify('Tuyệt vời! Em đã hoàn thành màn '+(S.level+1)+' và nhận 25 điểm.','good');Audio.fx('win');confetti();refreshLevel()}
function confetti(){if(reduced())return;let c=$('confetti');c.innerHTML=Array.from({length:23},(_,i)=>`<span style="left:${i*4.5}% ;background:${['#f28a5c','#8bdacf','#ad9fe6','#fbd16c'][i%4]};--dx:${(i%2?1:-1)*(25+i*2)}px;animation-delay:${(i%6)*.045}s"></span>`).join('');setTimeout(()=>{c.innerHTML=''},1900)}
function paint(phase=S.visual.doing,x=S.visual.x,words=S.visual.speech){S.visual={x,speech:words,doing:phase};const vp=$('sceneViewport');if(vp)vp.innerHTML=stageSVG(S.story||'cat',phase,x,words)}
function handleStory(id){if(S.level!==0||S.done[0])return;S.story=id;S.l1={actor:false,action:false,outcome:false};S.visual={x:0,speech:'',doing:''};S.runDone=false;Audio.fx('tap');notify('Đã chọn “'+story().name+'”. Hãy xác định 3 tiêu chí cần đạt.','good');refreshLevel()}
function answer1(key,val){if(!S.story||S.l1[key])return;const right=story()[key];if(val===right){S.l1[key]=true;if(key==='actor')S.visual={x:0,speech:'',doing:'idle'};if(key==='action')S.visual={x:story().distance*(S.story==='butterfly'?2.65:3.55)*.58,speech:'',doing:'move'};if(key==='outcome')S.visual={x:story().distance*(S.story==='butterfly'?2.65:3.55),speech:story().speech,doing:'say'};Audio.fx('correct');notify('Đúng rồi! '+({actor:'Nhân vật sẽ thực hiện câu chuyện.',action:'Nhân vật cần thay đổi vị trí.',outcome:'Lời chào sẽ xuất hiện trên sân khấu.'}[key]),'good');refreshLevel();if(Object.values(S.l1).every(Boolean))complete()}else{Audio.fx('wrong');notify('Chưa đúng. '+story().choiceHelp,'bad')}}
function selectPlan(id){if(S.done[1])return;const expected=GAME_CONFIG.steps[S.plan.length];if(!expected)return;if(id===expected.id){S.plan.push(id);if(id==='event')S.visual={x:0,speech:'',doing:'idle'};if(id==='move')S.visual={x:story().distance*(S.story==='butterfly'?2.65:3.55),speech:'',doing:'move'};if(id==='say')S.visual={x:story().distance*(S.story==='butterfly'?2.65:3.55),speech:story().speech,doing:'say'};if(id==='wait')S.visual={x:story().distance*(S.story==='butterfly'?2.65:3.55),speech:story().speech,doing:'wait'};Audio.fx('correct');notify('Đúng thứ tự! '+expected.info,'good');refreshLevel();if(S.plan.length===4)complete()}else{Audio.fx('wrong');notify('Thứ tự chưa đúng. Bước này cần thực hiện sau “'+expected.title+'”.','bad')}}
function unplan(index){if(S.done[1])return;S.plan=S.plan.slice(0,index);S.visual={x:0,speech:'',doing:'idle'};notify('Đã bỏ bước này và các bước phía sau. Hãy xếp tiếp.');refreshLevel()}
function addBlock(idx,id){if(S.level!==2||S.done[2]||S.runActive)return;if(!id){notify('Hãy chọn một khối lệnh ở bảng màu trước.','bad');return}const b=GAME_CONFIG.blocks.find(x=>x.id===id);S.placed[idx]=id;S.runDone=false;S.selected=null;Audio.fx('tap');notify('Đã đặt khối “'+b.text+'” vào vị trí '+(idx+1)+'.');refreshLevel()}
function validateBlocks(){let expect=GAME_CONFIG.steps.map(s=>s.id);for(let i=0;i<4;i++){if(S.placed[i]!==expect[i]){let chosen=S.placed[i];return {ok:false,message:`Vị trí ${i+1} chưa đúng. ${chosen?'Khối “'+GAME_CONFIG.blocks.find(b=>b.id===chosen).text+'” chưa phù hợp.':'Ô này còn trống.'} ${GAME_CONFIG.steps[i].info}`}}}return {ok:true}}
let frames=new Set();let timeouts=new Set();
function delay(ms,token){return new Promise(resolve=>{const t=setTimeout(()=>{timeouts.delete(t);resolve(token===S.runId)},ms);timeouts.add(t)})}
function moveTo(dest,ms,token){return new Promise(resolve=>{const started=performance.now(),from=S.visual.x;function tick(now){if(token!==S.runId){resolve(false);return}const v=Math.min(1,(now-started)/ms);let eased=v*v*(3-2*v);paint('move',from+(dest-from)*eased,'');if(v<1){let f=requestAnimationFrame(tick);frames.add(f)}else resolve(true)}let f=requestAnimationFrame(tick);frames.add(f)})}
function cancelRun(){S.runId++;S.runActive=false;for(let f of frames)cancelAnimationFrame(f);frames.clear();for(let t of timeouts)clearTimeout(t);timeouts.clear()}
async function executeProgram(params,context){if(S.runActive)return;cancelRun();S.runActive=true;let token=S.runId;S.runDone=false;paint('idle',0,'');const btn=$('sceneViewport');if(context==='3')notify('Cờ xanh đã được bật: chương trình đang thực hiện các khối lệnh.','good');else notify('Đang chạy thử chương trình em đã sửa…','good');Audio.fx('run');const target=Number(params.distance)*(S.story==='butterfly'?2.65:3.55);try{if(!await delay(180,token))return;if(!await moveTo(target,reduced()?50:1050,token))return;paint('say',target,params.speech);Audio.fx('correct');if(!await delay(reduced()?150:Number(params.wait)*900,token))return;paint('idle',target,'');S.runActive=false;S.runDone=true;if(context==='3'){notify('Chương trình chạy đúng: nhân vật di chuyển, hiện lời chào và đợi trước khi kết thúc.','good');complete()}else{notify('Chạy thử đạt yêu cầu! Em hãy lưu sản phẩm để hoàn thành triển lãm.','good');refreshLevel()}}finally{if(token===S.runId)S.runActive=false}}
function run3(){if(S.done[2])return;const v=validateBlocks();if(!v.ok){Audio.fx('wrong');notify(v.message,'bad');return}executeProgram({...story(),wait:1},'3')}
function run4(){if(S.runActive)return;let errors=[];if(S.fix.distance!==String(story().distance))errors.push('số bước chưa đưa nhân vật đến đúng đích');if(S.fix.speech!==story().speech)errors.push('lời chào chưa đúng nội dung');if(S.fix.wait!=='1')errors.push('thời gian đợi cần là 1 giây');if(errors.length){S.runDone=false;Audio.fx('wrong');notify('Chương trình còn lỗi: '+errors.join('; ')+'. Hãy chỉnh rồi chạy thử lại.','bad');return}executeProgram({distance:S.fix.distance,speech:S.fix.speech,wait:S.fix.wait},'4')}
function saveProduct(){if(S.level!==3||!S.runDone||S.saved)return;S.saved={story:S.story,blocks:GAME_CONFIG.steps.map(x=>x.id),params:{...S.fix},savedInSession:true};Audio.fx('win');complete()}
const Audio={ctx:null,musicOn:true,sfxOn:true,musicTimer:null,enabled:false,note(f,d=.12,vol=.1){if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(gain);gain.connect(this.ctx.destination);osc.start(t);osc.stop(t+d+.025)},activate(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}this.enabled=true;this.ctx.resume().catch(()=>{});this.manage()},fx(type){if(!this.sfxOn||!this.enabled)return;const notes={tap:[520],correct:[660,880],wrong:[265,245],win:[523,659,784,1047],run:[440,660]};let a=notes[type]||[420];a.forEach((f,i)=>{if(!this.ctx||this.ctx.state!=='running')return;const osc=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime+i*.075;osc.type='sine';osc.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(GAME_CONFIG.audio.sfxVolume*.48,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.16);osc.connect(g);g.connect(this.ctx.destination);osc.start(t);osc.stop(t+.18)})},manage(){if(this.musicTimer){clearInterval(this.musicTimer);this.musicTimer=null}if(!this.enabled||!this.musicOn||S.screen==='home'||S.screen==='how'||document.hidden)return;let n=0,mel=[392,440,523,440,349,392,494,392];this.musicTimer=setInterval(()=>{if(this.ctx?.state==='running'){this.note(mel[n%mel.length],.21,GAME_CONFIG.audio.musicVolume*.25);n++}},330)},toggle(k){this[k]=!this[k];if(!this.enabled&&S.screen!=='home'&&S.screen!=='how')this.activate();this.manage();const btn=$(k==='musicOn'?'musicToggle':'sfxToggle');if(btn){btn.setAttribute('aria-pressed',String(this[k]));btn.innerHTML=`<b>${k==='musicOn'?'♫':'♪'}</b> ${k==='musicOn'?'Nhạc nền':'Hiệu ứng'}: ${this[k]?'Bật':'Tắt'}`}}};
document.addEventListener('visibilitychange',()=>Audio.manage());
function goHome(){cancelRun();S.screen='home';S.visual={x:0,speech:'',doing:''};render()}
function next(){if(!S.done[S.level])return;cancelRun();if(S.level===3)S.screen='summary';else{S.level++;S.hint=0;S.feedback='';S.feedbackType='';S.runDone=false;S.visual={x:0,speech:'',doing:''}}render();window.scrollTo(0,0)}
function jump(n){if(n>0&&!S.done[n-1])return;cancelRun();S.screen='level';S.level=n;S.hint=0;S.feedback='';S.feedbackType='';S.visual={x:0,speech:'',doing:''};render();window.scrollTo(0,0)}
function replay(){if(!S.saved)return;S.screen='summary';render();const t=story();const visual=$('sceneViewport');let box=document.querySelector('.gallery svg');if(!box)return;let token=++S.runId;const starting=performance.now();const duration=reduced()?100:1800;function step(now){if(token!==S.runId)return;let p=Math.min(1,(now-starting)/duration),x=t.distance*(S.story==='butterfly'?2.65:3.55)*p;box.outerHTML=stageSVG(S.story,p<.9?'move':'say',x,p>.75?t.speech:'');box=document.querySelector('.gallery svg');if(p<1)requestAnimationFrame(step);else{Audio.fx('correct')}}requestAnimationFrame(step)}
document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){S.mode=mode.dataset.mode;Audio.fx('tap');render();return}const storyBtn=e.target.closest('[data-story]');if(storyBtn){handleStory(storyBtn.dataset.story);return}const a=e.target.closest('[data-answer1]');if(a){answer1(a.dataset.answer1,a.dataset.value);return}const plan=e.target.closest('[data-plan]');if(plan){selectPlan(plan.dataset.plan);return}const unplan=e.target.closest('[data-unplan]');if(unplan){unplanAt(+unplan.dataset.unplan);return}const rem=e.target.closest('[data-remove]');if(rem){S.placed[+rem.dataset.remove]=null;S.runDone=false;Audio.fx('tap');notify('Đã gỡ khối để em chọn lại.');refreshLevel();return}const block=e.target.closest('[data-block]');if(block){if(S.dragging){S.dragging=false;return}S.selected=block.dataset.block;Audio.fx('tap');notify('Đã chọn khối. Nhấn ô trong vùng chương trình để đặt khối.');refreshLevel();return}const slot=e.target.closest('[data-slot]');if(slot){addBlock(+slot.dataset.slot,S.selected);return}const jumpBtn=e.target.closest('[data-jump]');if(jumpBtn){jump(+jumpBtn.dataset.jump);return}const btn=e.target.closest('[data-action]');if(!btn)return;const cmd=btn.dataset.action;switch(cmd){case 'start':resetGame();break;case 'instructions':S.screen='how';render();break;case 'home':goHome();break;case 'hint':S.hint=Math.min(2,S.hint+1);refreshLevel();break;case 'resetLevel':resetLevel();break;case 'next':next();break;case 'run3':run3();break;case 'run4':run4();break;case 'stopRun':{let was=S.runActive;cancelRun();paint('idle',0,'');notify(was?'Đã dừng chương trình. Em có thể chạy lại.':'Chương trình đang ở trạng thái dừng.');refreshLevel();break}case 'saveProduct':saveProduct();break;case 'replay':replay();break;case 'playAgain':resetGame();break}});
function unplanAt(i){unplan(i)}
document.addEventListener('change',e=>{const el=e.target.closest('[data-fix]');if(el){if(S.runActive)cancelRun();S.fix[el.dataset.fix]=el.value;S.runDone=false;S.saved=null;if(S.done[3])S.done[3]=false;S.visual={x:0,speech:'',doing:'idle'};Audio.fx('tap');notify('Đã sửa lệnh. Hãy chạy thử để kiểm tra kết quả.');refreshLevel()}});
document.addEventListener('keydown',e=>{const slot=e.target.closest('[data-slot]');if(slot&&(e.key==='Enter'||e.key===' ')){e.preventDefault();addBlock(+slot.dataset.slot,S.selected)}});
let drag=null;document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-block]');if(!b||e.button!==0)return;drag={id:b.dataset.block,x:e.clientX,y:e.clientY,start:b,ghost:null,active:false,pointerId:e.pointerId};b.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){drag.active=true;drag.ghost=document.createElement('div');drag.ghost.className='dragGhost block';drag.ghost.dataset.kind=GAME_CONFIG.blocks.find(b=>b.id===drag.id).kind;drag.ghost.textContent=GAME_CONFIG.blocks.find(b=>b.id===drag.id).text;document.body.appendChild(drag.ghost)}if(drag.active){drag.ghost.style.left=e.clientX+12+'px';drag.ghost.style.top=e.clientY+12+'px';document.querySelectorAll('.slot.target').forEach(s=>s.classList.remove('target'));document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot')?.classList.add('target')}});
document.addEventListener('pointerup',e=>{if(!drag||drag.pointerId!==e.pointerId)return;let d=drag;drag=null;if(d.ghost)d.ghost.remove();document.querySelectorAll('.slot.target').forEach(s=>s.classList.remove('target'));if(d.active){S.dragging=true;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(target)addBlock(+target.dataset.slot,d.id);else notify('Thả khối vào một ô trong vùng chương trình nhé.','bad');setTimeout(()=>S.dragging=false,70)}});
document.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null;document.querySelectorAll('.slot.target').forEach(s=>s.classList.remove('target'))});
$('app').addEventListener('click',e=>{if(e.target.closest('#musicToggle'))Audio.toggle('musicOn');if(e.target.closest('#sfxToggle'))Audio.toggle('sfxOn')});
render();
</script>
</body></html>
