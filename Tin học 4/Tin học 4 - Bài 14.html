function svgMay(face='smile'){return `<svg viewBox="0 0 105 110" role="img" aria-label="Mây nhà phát minh nhỏ"><path d="M26 91 Q12 74 26 66 L82 66 Q96 82 82 105 L26 105 Z" fill="#8f79ce"/><path d="M12 43 Q10 14 45 9 Q82 2 94 35 L88 56 L17 59 Z" fill="#4a4d85"/><ellipse cx="52" cy="52" rx="37" ry="37" fill="#ffceae"/><path d="M17 35 Q30 7 52 15 Q76 4 88 29 Q74 32 66 20 Q47 42 17 35" fill="#44446f"/><rect x="11" y="35" width="84" height="20" rx="10" fill="#b9e7fa" stroke="#7e78b9" stroke-width="4"/><rect x="20" y="37" width="28" height="16" rx="8" fill="#f4ffff"/><rect x="55" y="37" width="28" height="16" rx="8" fill="#f4ffff"/><circle cx="35" cy="46" r="3" fill="#3c4663"/><circle cx="68" cy="46" r="3" fill="#3c4663"/>${face==='happy'?'<path d="M40 69 Q52 83 66 69" stroke="#b16662" stroke-width="4" fill="none" stroke-linecap="round"/>':face==='oops'?'<path d="M44 74 Q52 65 61 74" stroke="#b16662" stroke-width="3" fill="none"/>':'<path d="M42 70 Q52 78 62 70" stroke="#b16662" stroke-width="3" fill="none"/>'}<circle cx="23" cy="62" r="6" fill="#ffabb0" opacity=".5"/><circle cx="81" cy="62" r="6" fill="#ffabb0" opacity=".5"/><path d="M35 98 L35 109 M69 98 L69 109" stroke="#61548e" stroke-width="7"/></svg>`}
function svgComputer(){return `<svg viewBox="0 0 530 340" aria-label="Máy tính với giao diện lập trình mô phỏng"><defs><linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8fbff"/><stop offset="1" stop-color="#c5f1ef"/></linearGradient></defs><rect x="24" y="20" width="480" height="278" rx="20" fill="#3e527c"/><rect x="35" y="30" width="458" height="251" rx="12" fill="#f7f9fd"/><rect x="35" y="30" width="458" height="35" rx="12" fill="#7467be"/><circle cx="58" cy="47" r="6" fill="#ffe39d"/><circle cx="78" cy="47" r="6" fill="#ffc2a8"/><circle cx="98" cy="47" r="6" fill="#9ce6cd"/><rect x="48" y="77" width="105" height="183" rx="9" fill="#fff" stroke="#dce8f0"/><rect x="163" y="77" width="129" height="183" rx="9" fill="#fff" stroke="#dce8f0"/><rect x="304" y="77" width="174" height="135" rx="9" fill="url(#screenGrad)"/><rect x="304" y="216" width="174" height="44" rx="8" fill="#fff"/><g fill="#427ed1"><rect x="56" y="95" width="92" height="20" rx="8"/><rect x="56" y="122" width="85" height="20" rx="8"/></g><g fill="#9062c9"><rect x="56" y="153" width="92" height="20" rx="8"/><rect x="56" y="180" width="85" height="20" rx="8"/></g><rect x="178" y="91" width="95" height="28" rx="7" fill="#d3a11d"/><rect x="178" y="120" width="95" height="28" rx="7" fill="#427ed1"/><rect x="178" y="149" width="95" height="28" rx="7" fill="#9062c9"/><path d="M313 95 L327 87 L327 103 Z" fill="#51bd83"/><rect x="337" y="92" width="12" height="12" rx="2" fill="#f47f75"/><path d="M386 131 Q420 110 451 135" fill="none" stroke="white" stroke-width="5"/><g transform="translate(345 115) scale(.60)">${svgCat()}</g><rect x="226" y="298" width="80" height="21" rx="5" fill="#7e8ba5"/><path d="M184 319 H347 L361 329 H170 Z" fill="#4a5e86"/></svg>`}
function badgeInfo(){return `<span class="pill">✦ 4 nhiệm vụ</span><span class="pill">★ 100 điểm</span><span class="pill">⌘ Chạy ngoại tuyến</span>`}
function welcome(){state.view='welcome';stopRun();stopMusic();root.innerHTML=`<div class="hero"><div class="hero-left"><span class="eyebrow">KHÁM PHÁ · THỰC HÀNH · SÁNG TẠO</span><h1>CHUYẾN THÁM HIỂM <span>SCRATCH</span></h1><p class="desc">Cùng nhà phát minh Mây bước vào phòng thí nghiệm! Tìm hiểu giao diện, khám phá khối lệnh và điều khiển chú mèo bằng những chương trình em tự ghép.</p><div class="mode" role="group" aria-label="Chế độ chơi"><label><input type="radio" name="mode" value="practice" ${state.mode==='practice'?'checked':''}> Luyện tập</label><label><input type="radio" name="mode" value="challenge" ${state.mode==='challenge'?'checked':''}> Thử thách</label></div><div class="cta"><button class="btn primary" data-action="start">▶ Bắt đầu khám phá</button><button class="btn secondary" data-action="guide">ⓘ Hướng dẫn</button></div><div class="hero-tag">${badgeInfo()}</div><p class="welcome-note">Không cần đăng nhập · Không giới hạn thời gian · Không có giọng đọc</p></div><div class="hero-art"><div class="art-card"><span class="art-badge">PHÒNG THÍ NGHIỆM 4.0</span>${svgComputer()}<div style="display:flex;gap:8px;align-items:center;background:#e9faf4;border-radius:16px;padding:6px 12px;margin-top:5px">${svgMay()}<span style="font-size:13px;font-weight:800;color:#3e5670">Mây: “Hãy thử ghép những khối lệnh thú vị!”</span></div></div></div></div>`}
function guide(){state.view='guide';stopRun();stopMusic();root.innerHTML=`<div class="guide"><span class="eyebrow">HƯỚNG DẪN CHỈ BẰNG CHỮ & HÌNH</span><h2>Chào mừng đến phòng thí nghiệm!</h2><div class="mascot">${svgMay()}<div><b>Mây luôn đồng hành cùng em.</b><p>Chọn thẻ, rồi nhấn vùng đích. Em cũng có thể kéo thả bằng chuột hoặc cảm ứng. Không có âm thanh lời nói.</p></div></div><ol><li><b>Bản đồ Scratch:</b> đặt sáu nhãn giao diện vào đúng vùng.</li><li><b>Khối lệnh ở đâu:</b> chọn khối lệnh và đưa vào nhóm thích hợp.</li><li><b>Chạy và dừng:</b> xếp khối, nhấn cờ xanh, sau đó nhấn nút dừng.</li><li><b>Sửa chương trình:</b> thay khối sai, chạy thử mỗi nhiệm vụ.</li></ol><p><b>Điểm:</b> hoàn thành đúng mỗi màn được 25 điểm, tối đa 100 điểm. Bấm <b>Gợi ý</b> để nhận lần lượt hai gợi ý, không trừ điểm. Nút <b>Làm lại màn</b> xóa kết quả của màn đó để em làm lại.</p><p class="small">Các vùng Scratch và khối lệnh trong trò chơi là mô phỏng phục vụ học tập, không phải ứng dụng Scratch thật.</p><button class="btn primary" data-action="start">▶ Đã hiểu, bắt đầu</button> <button class="btn soft" data-action="home">Về trang chủ</button></div>`}
function initLevel(i){state.level=i;state.view='game';state.picked=null;state.hints=0;state.feedback='';state.feedbackKind='';stopRun();state.catMove=0;state.catSpeech='';state.catCostume=false;state.mission=0;state.missionDone=[false,false,false];state.progress=i===0?{labels:{}}:i===1?{classified:{}}:i===2?{slots:[null,null,null],ran:false,stopped:false}:{fixes:GAME_CONFIG.stages[3].missions.map(m=>[...m.initial])};if(state.completed[i]){if(i===0)state.progress.labels=Object.fromEntries(GAME_CONFIG.stages[0].items.map(x=>[x.id,true]));if(i===1)state.progress.classified=Object.fromEntries(GAME_CONFIG.stages[1].items.map(x=>[x.id,x.type]));if(i===2)state.progress={slots:[...GAME_CONFIG.stages[2].expected],ran:true,stopped:true};if(i===3){state.progress.fixes=GAME_CONFIG.stages[3].missions.map(m=>[...m.expected]);state.missionDone=[true,true,true];state.mission=2}state.feedback='Màn đã hoàn thành. Em có thể xem lại, chuyển tiếp hoặc chọn Làm lại màn để luyện tập lại.';state.feedbackKind='good'}render();}
function start(){stopMusic();state.completed=[false,false,false,false];state.unlocked=0;initLevel(0);startMusic();}
function stopRun(){state.runId++;for(const t of state.timer)clearTimeout(t);state.timer=[];state.running=false;state.catMove=0;state.catSpeech='';}
function later(fn,ms){const id=setTimeout(fn,ms);state.timer.push(id);return id}
function message(t,kind=''){state.feedback=t;state.feedbackKind=kind;const f=document.getElementById('feedback');if(f){f.className='statusbox '+kind;f.textContent=t}if(kind==='bad'){sfx('bad')}else if(kind==='good'){sfx('good')}}
function complete(){if(!state.completed[state.level]){state.completed[state.level]=true;state.unlocked=Math.max(state.unlocked,state.level+1);sfx('complete');confetti()}state.picked=null;state.feedback='Xuất sắc! Hoàn thành nhiệm vụ, nhận 25 điểm. Em có thể chuyển màn.';state.feedbackKind='good';render()}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<18;i++){const el=document.createElement('span');el.className='confetti';el.style.left=(8+Math.random()*85)+'%';el.style.background=['#ff9850','#40b8b3','#8069c6','#ffd773'][i%4];el.style.animationDelay=Math.random()*.22+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),2000)}}
function gameHeader(){const cfg=GAME_CONFIG.stages[state.level];return `<div class="game-head"><div><div class="small">NHIỆM VỤ ${state.level+1}/4 · ${state.mode==='practice'?'LUYỆN TẬP':'THỬ THÁCH'}</div><h2>${cfg.title}</h2></div><div class="status"><div class="stat"><div class="small">TỔNG ĐIỂM</div><strong>${score()}/100</strong></div><div class="stat"><div class="small">HOÀN THÀNH</div><strong>${state.completed.filter(Boolean).length}/4</strong></div></div></div><div class="progress">${GAME_CONFIG.stages.map((x,i)=>`<button class="step ${i===state.level?'active':state.completed[i]?'done':''}" data-action="jump" data-i="${i}" ${i>state.unlocked?'disabled':''} title="${escapeHTML(x.title)}">${state.completed[i]?'✓ ':''}Màn ${i+1}</button>`).join('')}</div>`}
function mascot(t){return `<div class="mascot">${svgMay(state.feedbackKind==='good'?'happy':state.feedbackKind==='bad'?'oops':'smile')}<div><strong>Mây nhắn:</strong><p>${escapeHTML(t)}</p></div></div>`}
function blockHTML(id,attrs=''){const b=BLOCKS[id];return `<span class="block ${b.type}" ${attrs}>${escapeHTML(b.text)}</span>`}
function catPreview(){return `<div class="stage-preview" id="stagePrev"><span class="stage-sun"></span><span class="stage-tree"></span><div class="cat-wrap" id="cat" style="transform:translateX(${state.catMove}px)">${svgCat(state.catCostume)}</div>${state.catSpeech?`<div class="speech" id="bubble">${escapeHTML(state.catSpeech)}</div>`:''}</div>`}
function studioMap(){const used=state.progress.labels;const tagged=id=>used[id]?`<span style="font-size:10px">✓ ${escapeHTML(GAME_CONFIG.stages[0].items.find(x=>x.id===id).name)}</span>`:'<span style="font-size:10px;opacity:.55">+ Đặt nhãn</span>';return `<div class="studio"><div class="studio-top"><span>Ứng dụng Scratch mô phỏng</span><span>● PHÒNG THÍ NGHIỆM 01</span></div><div class="studio-grid"><div class="studio-col"><div class="studio-label target ${used.palette?'filled':''}" data-drop="palette" tabindex="0">${tagged('palette')}</div><div class="studio-blocks" data-drop="palette" style="background:#f5faff"><span class="block motion" style="pointer-events:none">di chuyển 10 bước</span><span class="block looks" style="pointer-events:none">nói Xin chào!</span><span class="block event" style="pointer-events:none">khi bấm cờ xanh</span><span class="block control" style="pointer-events:none">đợi 1 giây</span></div></div><div class="studio-col"><div class="studio-label target ${used.script?'filled':''}" data-drop="script" tabindex="0">${tagged('script')}</div><div class="workspace" data-drop="script"><span class="block event" style="pointer-events:none">khi bấm cờ xanh</span><span class="block motion" style="pointer-events:none;margin-top:3px">di chuyển 10 bước</span></div></div><div class="studio-col"><div class="studio-label"><span class="target ${used.flag?'filled':''}" data-drop="flag" tabindex="0">${used.flag?tagged('flag'):'⚑ Cờ xanh'}</span><span class="target ${used.stop?'filled':''}" data-drop="stop" tabindex="0" style="margin-top:3px">${used.stop?tagged('stop'):'■ Nút dừng'}</span></div><div class="target ${used.stage?'filled':''}" data-drop="stage" tabindex="0" style="margin:3px;min-height:34px">${tagged('stage')}</div>${catPreview()}<div class="stage-sprite target ${used.sprite?'filled':''}" data-drop="sprite" tabindex="0"><div class="mini-cat">${svgCat()}</div>${tagged('sprite')}</div></div></div></div>`}
function stage1(){const used=state.progress.labels;const items=GAME_CONFIG.stages[0].items;return `<div class="stage-layout"><section class="panel"><div class="scene-title">PHÒNG ĐỊNH VỊ · BẢN ĐỒ GIAO DIỆN</div><h3>Đặt tên cho các khu vực</h3><p>Chọn một nhãn bên phải, sau đó nhấn vùng tương ứng trên giao diện. Có thể kéo nhãn tới vùng đích.</p>${studioMap()}<div class="map-hint">Đã xác định: ${Object.keys(used).length}/6 vùng · Nhấn vào vùng có viền đứt để đặt nhãn.</div></section><aside class="panel">${mascot('Sân khấu là nơi mèo biểu diễn. Các khối lệnh được ghép ở vùng chương trình.')}<h3>Kho nhãn bí mật</h3><p>Chọn nhãn rồi đặt vào đúng vị trí.</p><div class="tile-grid">${items.map((x,i)=>`<button class="tile ${state.picked===x.id?'selected':''} ${used[x.id]?'used':''}" data-action="pick-map" data-drag="map" data-id="${x.id}" ${used[x.id]?'disabled':''}><span class="badge">${i+1}</span>${escapeHTML(x.name)}</button>`).join('')}</div><div class="story">🔎 Mẹo: “Nhân vật” là chú mèo; “Sân khấu” là nơi chú mèo xuất hiện.</div></aside></div>`}
function stage2(){const classified=state.progress.classified;const items=GAME_CONFIG.stages[1].items;return `<div class="stage-layout"><section class="panel"><div class="scene-title">KHO LỆNH 4 MÀU</div><h3>Tìm đúng ngăn cho khối lệnh</h3><p>Chọn một khối lệnh, sau đó chọn nhóm phù hợp.</p><div class="category-grid">${GROUPS.map(g=>`<button class="category" data-drop="group-${g.id}" data-action="drop-group" data-id="${g.id}" style="border-color:${g.color};background:${g.color}15"><span style="display:block;width:16px;height:16px;border-radius:5px;background:${g.color};margin:0 auto 6px"></span>${g.name}<div class="small">${Object.entries(classified).filter(([id,t])=>t===g.id).length}/2 khối</div></button>`).join('')}</div><div class="story">Mỗi nhóm có 2 khối. Khi xếp đúng, màu nhóm và bộ đếm sẽ cập nhật.</div></section><aside class="panel">${mascot('Nhìn màu sắc và ý nghĩa của khối lệnh để tìm đúng nhóm!')}<h3>Các khối cần phân loại</h3><div class="tile-grid">${items.map(b=>`<button class="tile ${state.picked===b.id?'selected':''} ${classified[b.id]?'used':''}" data-action="pick-block" data-drag="group" data-id="${b.id}" ${classified[b.id]?'disabled':''}><span class="block ${b.type}" style="pointer-events:none">${escapeHTML(b.text)}</span></button>`).join('')}</div><p class="inline-note">Đã xếp đúng: ${Object.keys(classified).length}/8 khối</p></aside></div>`}
function studio3(){let slots=state.progress.slots;return `<div class="studio"><div class="studio-top">MÔ PHỎNG CHƯƠNG TRÌNH ĐẦU TIÊN <span>Vùng thực thi</span></div><div class="studio-grid"><div class="studio-col"><div class="studio-label">Nhóm khối</div><div class="studio-blocks">${GROUPS.map(g=>`<div class="badge" style="background:${g.color}22">${g.name}</div>`).join('')}</div></div><div class="studio-col"><div class="studio-label">Vùng chương trình</div><div class="workspace"><div class="slots">${slots.map((v,i)=>`<button class="slot" data-action="slot3" data-drop="slot-${i}" data-i="${i}">${v?blockHTML(v,'tabindex="-1" style="pointer-events:none"'):`${i+1}. Đặt khối lệnh`}</button>`).join('')}</div></div></div><div class="studio-col"><div class="studio-label">⚑ Sân khấu</div>${catPreview()}<div class="stage-sprite"><div class="mini-cat">${svgCat()}</div><span>Mèo</span></div></div></div></div>`}
function stage3(){return `<div class="stage-layout"><section class="panel"><div class="scene-title">TRUNG TÂM ĐIỀU KHIỂN MÈO</div><h3>Ghép lệnh → chạy thử → dừng</h3><p>Chọn từng khối, đặt vào ô 1–3 theo thứ tự; sau đó chạy bằng cờ xanh và dừng bằng nút vuông đỏ.</p>${studio3()}<div class="actions" style="margin-top:10px"><button class="btn teal" data-action="run3" ${state.running?'disabled':''}>⚑ Cờ xanh · Chạy</button><button class="btn secondary" data-action="stop3" ${state.running?'':'disabled'}>■ Dừng</button><button class="btn soft" data-action="clear3">↺ Xóa khối</button></div><div class="inline-note" style="margin-top:8px">${state.running?'Chương trình đang chạy: quan sát chú mèo và bấm Dừng.':state.progress.stopped?'Đã thực hành cả chạy và dừng.':'Chương trình chỉ chạy khi ghép đúng 3 khối.'}</div></section><aside class="panel">${mascot('Bắt đầu bằng khối sự kiện cờ xanh; lệnh di chuyển làm mèo tiến lên, lệnh nói hiện bong bóng chữ.')}<h3>Kho 3 khối lệnh</h3><div class="tile-grid">${GAME_CONFIG.stages[2].items.map(b=>`<button class="tile ${state.picked===b.id?'selected':''}" data-action="pick-3" data-drag="slot3" data-id="${b.id}"><span class="block ${b.type}" style="pointer-events:none">${escapeHTML(b.text)}</span></button>`).join('')}</div><div class="story"><b>Nhiệm vụ:</b><br>① Đặt cờ xanh ở đầu<br>② Cho mèo di chuyển<br>③ Hiện bong bóng chữ<br>④ Bấm cờ xanh rồi bấm Dừng.</div></aside></div>`}
function stage4(){const cfg=GAME_CONFIG.stages[3];const mi=cfg.missions[state.mission];const slots=state.progress.fixes[state.mission];return `<div class="stage-layout"><section class="panel"><div class="scene-title">TRẠM SỬA LỖI CHƯƠNG TRÌNH</div><div class="mission-grid">${cfg.missions.map((m,i)=>`<button class="mission ${i===state.mission?'active':''} ${state.missionDone[i]?'done':''}" data-action="select-mission" data-i="${i}" ${i>state.mission?'disabled':''}>${state.missionDone[i]?'✓ ':''}Ca ${i+1}<br>${escapeHTML(m.title)}</button>`).join('')}</div><h3>${escapeHTML(mi.title)}</h3><p>${escapeHTML(mi.goal)}</p><div class="studio"><div class="studio-top">GIAO DIỆN LẬP TRÌNH MÔ PHỎNG <span>CA ${state.mission+1}/3</span></div><div class="studio-grid"><div class="studio-col"><div class="studio-label">Bảng lệnh</div><div class="studio-blocks">${['mv','say','wait','spin','costume'].map(id=>`<span class="block ${BLOCKS[id].type}" style="font-size:10px">${escapeHTML(BLOCKS[id].text)}</span>`).join('')}</div></div><div class="studio-col"><div class="studio-label">Vùng chương trình</div><div class="workspace"><div class="slots">${slots.map((id,i)=>`<button class="slot" data-action="replace4" data-drop="replace-${i}" data-i="${i}" ${state.running?'disabled':''}>${blockHTML(id,'tabindex="-1" style="pointer-events:none"')}</button>`).join('')}</div></div></div><div class="studio-col"><div class="studio-label">Sân khấu</div>${catPreview()}<div class="stage-sprite"><div class="mini-cat">${svgCat()}</div><span>Mèo</span></div></div></div></div><div class="actions" style="margin-top:10px"><button class="btn teal" data-action="run4" ${state.running||state.missionDone[state.mission]?'disabled':''}>⚑ Chạy thử chương trình</button><button class="btn soft" data-action="reset-mission" ${state.running?'disabled':''}>↺ Sửa lại ca này</button></div></section><aside class="panel">${mascot('Bác sĩ lập trình: khối nào không phù hợp với nhiệm vụ? Thay đúng khối rồi chạy thử!')}<h3>Kho khối thay thế</h3><p>Chọn khối mới rồi nhấn ô cần thay. Có thể kéo khối tới ô cần sửa.</p><div class="tile-grid">${['mv','say','wait','spin','costume'].map(id=>`<button class="tile ${state.picked===id?'selected':''}" data-action="pick-4" data-drag="replace" data-id="${id}"><span class="block ${BLOCKS[id].type}" style="pointer-events:none">${escapeHTML(BLOCKS[id].text)}</span></button>`).join('')}</div><div class="story">Đã sửa xong <b>${state.missionDone.filter(Boolean).length}/3 ca</b>. Khi chương trình đúng, mèo sẽ thực hiện các hành động theo thứ tự.</div></aside></div>`}
function hint(){state.hints=Math.min(2,state.hints+1);let msg='';if(state.level===0){const missing=GAME_CONFIG.stages[0].items.find(x=>!state.progress.labels[x.id]);msg=state.hints===1?'Hãy tìm tên “Vùng khối lệnh”, “Vùng chương trình”, “Sân khấu” ở những khu vực lớn trong giao diện.':missing?`Gợi ý cụ thể: “${missing.name}”. ${missing.why}`:'Em đã gắn tất cả nhãn.'}if(state.level===1){const missing=GAME_CONFIG.stages[1].items.find(x=>!state.progress.classified[x.id]);msg=state.hints===1?'Khối màu xanh lam thường là Chuyển động; tím là Hiển thị; vàng là Sự kiện; cam là Điều khiển.':missing?`Khối “${missing.text}” thuộc nhóm ${GROUPS.find(g=>g.id===missing.type).name}. ${missing.why}`:'Em đã xếp xong tất cả khối.'}if(state.level===2)msg=state.hints===1?'Khối bắt đầu có hình cờ xanh. Sau đó mèo mới di chuyển rồi hiện lời nói.':'Thứ tự đúng: khi bấm cờ xanh → di chuyển 10 bước → nói Xin chào!; chạy rồi nhớ nhấn Dừng.';if(state.level===3){const mi=GAME_CONFIG.stages[3].missions[state.mission];msg=state.hints===1?'Đọc mục tiêu và so sánh từng khối đang có với hành động được yêu cầu.':`Cần thay một khối bằng “${BLOCKS[mi.fix].text}”. ${mi.why}`}message(msg,'');}
function render(){if(state.view==='welcome'){welcome();return}if(state.view==='guide'){guide();return}if(state.view==='summary'){summary();return}const cfg=GAME_CONFIG.stages[state.level];const content=[stage1,stage2,stage3,stage4][state.level]();root.innerHTML=`<div class="game">${gameHeader()}<div class="task-head"><span class="small"><b>${escapeHTML(cfg.subtitle)}</b></span><span class="badge">${state.completed[state.level]?'✓ ĐÃ HOÀN THÀNH':'ĐANG THỰC HIỆN'}</span></div>${state.mode==='practice'&&state.hints===0?'<div class="helper"><b>💡 Luyện tập:</b> Chọn thẻ hoặc khối lệnh, rồi nhấn vị trí cần đặt. Có thể dùng kéo thả.</div>':''}${content}<div id="feedback" class="statusbox ${state.feedbackKind}" role="status">${escapeHTML(state.feedback||'Sẵn sàng! Hãy bắt đầu tương tác để khám phá.')}</div><div class="game-footer"><div class="actions"><button class="btn soft sm" data-action="home">⌂ Trang chủ</button><button class="btn secondary sm" data-action="hint">✦ Gợi ý ${state.hints}/2</button><button class="btn soft sm" data-action="reset-level">↺ Làm lại màn</button></div><button class="btn primary" data-action="next" ${state.completed[state.level]?'':'disabled'}>${state.level===3?'★ Xem thành tích':'Tiếp tục →'}</button></div></div>`}
function summary(){stopRun();stopMusic();state.view='summary';root.innerHTML=`<div class="summary"><span class="eyebrow">NHIỆM VỤ HOÀN THÀNH</span><div style="margin:6px auto;width:116px">${svgMay('happy')}</div><h1>NHÀ THÁM HIỂM TÀI BA!</h1><div class="scorebig">${score()}<span style="font-size:26px;letter-spacing:0">/100</span></div><p>Em đã vượt qua phòng thí nghiệm Scratch và mở khóa huy hiệu!</p><div class="medals"><span class="medal">✦ Nhà thám hiểm giao diện</span><span class="medal">✦ Chuyên gia khối lệnh</span><span class="medal">✦ Người điều khiển mèo</span><span class="medal">✦ Bác sĩ sửa chương trình</span></div><div class="story" style="text-align:left"><b>Em đã học được:</b><br>✓ Phân biệt sân khấu, nhân vật, vùng khối lệnh và vùng chương trình.<br>✓ Nhận biết 4 nhóm lệnh màu sắc: Chuyển động, Hiển thị, Sự kiện, Điều khiển.<br>✓ Ghép lệnh đơn giản, bấm cờ xanh để chạy và nút dừng để kết thúc chương trình.</div><div class="cta" style="justify-content:center"><button class="btn primary" data-action="replay">↺ Chơi lại từ đầu</button><button class="btn secondary" data-action="home">⌂ Trang chủ</button></div><p class="footnote">Kết quả chỉ lưu trong lượt chơi hiện tại, không gửi đi đâu.</p></div>`}
function correctMap(id,target){if(state.completed[0])return;const item=GAME_CONFIG.stages[0].items.find(x=>x.id===id);if(!item)return;if(state.progress.labels[id]){message('Nhãn này đã được đặt rồi. Hãy chọn một nhãn khác.','bad');return}if(id!==target){message(`Chưa đúng. “${item.name}” chưa nằm ở khu vực em vừa chọn. ${item.why}`,'bad');return}state.progress.labels[id]=true;state.picked=null;if(Object.keys(state.progress.labels).length===6)complete();else{state.feedback=`Chính xác! ${item.why}`;state.feedbackKind='good';sfx('good');render()}}
function correctGroup(id,group){if(state.completed[1])return;const item=GAME_CONFIG.stages[1].items.find(x=>x.id===id);if(!item||state.progress.classified[id])return;if(item.type!==group){message(`Thử lại nhé! “${item.text}” chưa thuộc nhóm này. Em hãy nghĩ về tác dụng của khối.`, 'bad');return}state.progress.classified[id]=group;state.picked=null;if(Object.keys(state.progress.classified).length===8)complete();else{state.feedback=`Đúng rồi! ${item.why}`;state.feedbackKind='good';sfx('good');render()}}
function slot3(idx,id){if(state.completed[2]||state.running)return;if(!GAME_CONFIG.stages[2].items.some(x=>x.id===id))return;const slots=state.progress.slots;const old=slots.indexOf(id);if(old>=0)slots[old]=null;slots[idx]=id;state.picked=null;state.progress.ran=false;state.progress.stopped=false;state.feedback='Đã đặt khối vào ô '+(idx+1)+'. Em hãy tiếp tục sắp xếp.';state.feedbackKind='';sfx('pick');render()}
function run3(){if(state.completed[2]||state.running)return;const slots=state.progress.slots;if(slots.some((id,i)=>id!==GAME_CONFIG.stages[2].expected[i])){message('Các khối chưa theo đúng trình tự: sự kiện cờ xanh → di chuyển → nói. Em có thể đổi vị trí khối.','bad');return}state.running=true;state.progress.ran=true;state.catMove=0;state.catSpeech='';sfx('good');render();later(()=>{if(!state.running)return;state.catMove=45;state.catSpeech='Xin chào!';const cat=document.getElementById('cat');if(cat){cat.style.transform='translateX(45px)'}const prev=document.getElementById('stagePrev');if(prev)prev.insertAdjacentHTML('beforeend',`<div class="speech" id="bubble">Xin chào!</div>`);message('Mèo đã di chuyển và hiện bong bóng chữ! Bấm nút Dừng để kết thúc chương trình.','good')},500)}
function stop3(){if(!state.running){message('Chương trình chưa chạy. Hãy nhấn cờ xanh trước.','bad');return}const hadRun=state.progress.ran;stopRun();state.progress.stopped=hadRun;if(hadRun)complete();else render()}
function replace4(idx,id){if(state.running||state.missionDone[state.mission])return;if(!BLOCKS[id])return;state.progress.fixes[state.mission][idx]=id;state.picked=null;state.feedback='Đã thay khối ở vị trí '+(idx+1)+'. Nhấn “Chạy thử chương trình” để kiểm tra.';state.feedbackKind='';sfx('pick');render()}
function run4(){if(state.running||state.missionDone[state.mission])return;const mi=GAME_CONFIG.stages[3].missions[state.mission];const slots=state.progress.fixes[state.mission];if(slots.some((id,i)=>id!==mi.expected[i])){const wrong=slots.findIndex((id,i)=>id!==mi.expected[i]);message(`Chưa đúng ở khối số ${wrong+1}. ${mi.why}`,'bad');return}state.running=true;state.catMove=0;state.catSpeech='';state.catCostume=false;render();sfx('good');const runToken=state.runId;later(()=>{if(!state.running||runToken!==state.runId)return;state.catMove=mi.expected.includes('mv')?48:0;state.catSpeech=mi.expected.includes('say')?'Xin chào!':'';state.catCostume=mi.expected.includes('costume');const cat=document.getElementById('cat');if(cat){cat.style.transform=`translateX(${state.catMove}px)`;cat.innerHTML=svgCat(state.catCostume)}if(state.catSpeech)document.getElementById('stagePrev')?.insertAdjacentHTML('beforeend',`<div class="speech">${escapeHTML(state.catSpeech)}</div>`);message('Chương trình đang thực thi theo thứ tự các khối đã ghép.','good')},400);later(()=>{if(!state.running||runToken!==state.runId)return;stopRun();state.missionDone[state.mission]=true;if(state.missionDone.every(Boolean)){complete()}else{const old=state.mission;state.mission++;state.feedback=`Ca ${old+1} thành công! ${mi.why} Tiếp tục sửa ca ${state.mission+1}.`;state.feedbackKind='good';sfx('complete');render()}},1900)}
function resetLevel(){const i=state.level;state.completed[i]=false;initLevel(i);message('Đã làm lại màn này. Điểm của màn được thu hồi cho đến khi em hoàn thành lại.','')}
function onClick(e){const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,id=btn.dataset.id,idx=Number(btn.dataset.i);if(a==='home'){welcome();return}if(a==='guide'){guide();return}if(a==='start'||a==='replay'){start();return}if(a==='jump'){if(idx<=state.unlocked)initLevel(idx);return}if(a==='reset-level'){resetLevel();return}if(a==='hint'){hint();return}if(a==='next'){if(!state.completed[state.level])return;if(state.level===3)summary();else initLevel(state.level+1);return}if(a==='pick-map'||a==='pick-block'||a==='pick-3'||a==='pick-4'){state.picked=state.picked===id?null:id;sfx('pick');render();return}if(a==='drop-group'){if(state.picked)correctGroup(state.picked,id);else message('Hãy chọn một khối lệnh ở kho trước.','bad');return}if(a==='slot3'){if(state.picked)slot3(idx,state.picked);else if(state.progress.slots[idx]&&!state.completed[2]){state.progress.slots[idx]=null;render()}else message('Hãy chọn một khối lệnh trước.','bad');return}if(a==='run3'){run3();return}if(a==='stop3'){stop3();return}if(a==='clear3'){if(state.completed[2]){message('Màn này đã hoàn thành. Hãy chọn Làm lại màn để ghép lại.');return}stopRun();state.progress.slots=[null,null,null];state.picked=null;render();return}if(a==='pick-4'){state.picked=state.picked===id?null:id;sfx('pick');render();return}if(a==='replace4'){if(state.picked)replace4(idx,state.picked);else message('Chọn khối thay thế trước khi nhấn vị trí cần sửa.','bad');return}if(a==='run4'){run4();return}if(a==='reset-mission'){stopRun();const m=state.mission;state.missionDone[m]=false;state.progress.fixes[m]=[...GAME_CONFIG.stages[3].missions[m].initial];render();return}if(a==='select-mission'){if(idx<=state.mission){stopRun();state.mission=idx;render()}return}}
root.addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}const drop=e.target.closest('[data-drop]');if(drop&&!e.target.closest('[data-action]')){if(!state.picked){message('Hãy chọn nhãn trước khi nhấn vào vùng đích.','bad');return}if(state.level===0)correctMap(state.picked,drop.dataset.drop);return}onClick(e)});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drop]:not(button)')){e.preventDefault();if(state.level===0&&state.picked)correctMap(state.picked,e.target.dataset.drop)}});
// Kéo thả bằng Pointer Events. Vẫn luôn có phương án chọn → nhấn vùng đích bằng bàn phím.
let drag=null,ghost=null,suppressClick=false;
root.addEventListener('pointerdown',e=>{const tile=e.target.closest('[data-drag]');if(!tile||tile.disabled||e.button!==0)return;drag={id:tile.dataset.id,kind:tile.dataset.drag,x:e.clientX,y:e.clientY,moved:false,pointer:e.pointerId};});
window.addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.moved=true;ghost=document.createElement('div');ghost.className='dragghost';ghost.textContent=drag.id in BLOCKS?BLOCKS[drag.id].text:(GAME_CONFIG.stages[0].items.find(x=>x.id===drag.id)?.name||GAME_CONFIG.stages[1].items.find(x=>x.id===drag.id)?.text||drag.id);document.body.appendChild(ghost)}if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});
window.addEventListener('pointerup',e=>{if(!drag||drag.pointer!==e.pointerId)return;const d=drag;drag=null;if(ghost){ghost.remove();ghost=null}if(!d.moved)return;suppressClick=true;setTimeout(()=>suppressClick=false,50);const drop=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(!drop){message('Thả nhãn hoặc khối lên vị trí có viền đứt.','');return}const t=drop.dataset.drop;if(d.kind==='map'&&state.level===0)correctMap(d.id,t);if(d.kind==='group'&&state.level===1&&t.startsWith('group-'))correctGroup(d.id,t.slice(6));if(d.kind==='slot3'&&state.level===2&&t.startsWith('slot-'))slot3(Number(t.slice(5)),d.id);if(d.kind==='replace'&&state.level===3&&t.startsWith('replace-'))replace4(Number(t.slice(8)),d.id)});
window.addEventListener('pointercancel',()=>{drag=null;if(ghost){ghost.remove();ghost=null}});
document.querySelectorAll('input[name="mode"]').forEach(e=>e.addEventListener('change',()=>{}));root.addEventListener('change',e=>{if(e.target.name==='mode'){state.mode=e.target.value}});
// Âm thanh Web Audio: giai điệu tự tổng hợp, không tải tệp mạng, không TTS.
let audio=null,musicInterval=null,musicIndex=0;const melody=[392,523.25,587.33,523.25,440,493.88,523.25,392,349.23,440,523.25,440,392,329.63,349.23,392];
function ensureAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){audio=null}}
function tone(freq,delay,dur,gain,type='sine'){if(!audio||audio.state!=='running')return;try{const t=audio.currentTime+delay;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,gain),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(kind){if(!document.querySelector('#sfx').checked)return;ensureAudio();const v=GAME_CONFIG.sfxVolume;if(kind==='bad')tone(215,0,.15,v*.6,'triangle');else if(kind==='pick')tone(460,0,.08,v*.45);else if(kind==='complete'){tone(523,0,.22,v,'sine');tone(659,.15,.21,v,'sine');tone(784,.3,.35,v,'sine')}else{tone(523,0,.11,v*.65);tone(659,.1,.18,v*.65)}}
function stopMusic(){if(musicInterval!==null){clearInterval(musicInterval);musicInterval=null}musicIndex=0}
function startMusic(){stopMusic();if(!document.querySelector('#music').checked||document.hidden||state.view!=='game')return;ensureAudio();musicInterval=setInterval(()=>{if(document.hidden||state.view!=='game'||!document.querySelector('#music').checked){stopMusic();return}tone(melody[musicIndex%melody.length],0,.20,GAME_CONFIG.musicVolume*.32,'sine');if(musicIndex%4===0)tone(melody[musicIndex%melody.length]/2,0,.28,GAME_CONFIG.musicVolume*.13,'triangle');musicIndex++},340)}
document.querySelector('#music').addEventListener('change',e=>{if(e.target.checked&&state.view==='game')startMusic();else stopMusic()});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic()}else if(state.view==='game'){startMusic()}});
welcome();
</script></body></html>
