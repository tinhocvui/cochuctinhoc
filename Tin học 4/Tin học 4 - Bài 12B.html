<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Bàn Phím</title>
    <style>
        /* === BIẾN MÀU THEO YÊU CẦU === */
        :root {
            --bg-color: #FFF9ED;
            --primary: #40B8B3;
            --primary-dark: #329490;
            --secondary: #FF9850;
            --accent: #8069C6;
            --highlight: #FFD773;
            --text-main: #333333;
            --text-light: #ffffff;
            --correct: #4ade80;
            --wrong: #f87171;
            --gray: #e5e7eb;
        }

        /* === CƠ BẢN === */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* === LAYOUT CHÍNH === */
        #game-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 650px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === HEADER (Thanh trạng thái) === */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--bg-color);
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .stats { display: flex; gap: 20px; font-weight: bold; font-size: 1.1rem; color: var(--accent); }
        .controls { display: flex; gap: 10px; }
        
        /* === NÚT BẤM === */
        button {
            border: none; border-radius: 12px; padding: 10px 20px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 1.2rem; }

        /* === MÀN HÌNH CHÀO === */
        #welcome-screen { align-items: center; justify-content: center; text-align: center; }
        #welcome-screen h1 { color: var(--accent); font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 0 var(--highlight); }
        #welcome-screen p { font-size: 1.2rem; margin-bottom: 30px; color: #555; }
        .hero-svg { width: 250px; height: 250px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* === MÀN HÌNH CHƠI === */
        .game-header { text-align: center; margin-bottom: 15px; }
        .game-header h2 { color: var(--primary); font-size: 1.8rem; }
        .game-header p { color: #666; }

        .game-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #fafafa; border-radius: 15px; padding: 20px;
            position: relative; border: 2px dashed var(--gray);
        }

        .bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 15px;
        }

        /* === NHÂN VẬT & BONG BÓNG === */
        .character-container {
            position: absolute; bottom: 10px; left: 10px;
            display: flex; align-items: flex-end; gap: 15px;
            pointer-events: none;
        }
        .chibi-may { width: 100px; height: 100px; }
        .speech-bubble {
            background: white; border: 2px solid var(--primary);
            border-radius: 15px; padding: 10px 15px;
            font-size: 0.9rem; font-weight: bold; color: var(--primary-dark);
            max-width: 250px; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            opacity: 0; transition: opacity 0.3s;
        }
        .speech-bubble.show { opacity: 1; }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: 10px; left: -10px;
            border-width: 10px 15px 10px 0; border-style: solid;
            border-color: transparent var(--primary) transparent transparent;
        }

        /* === MÀN 1: TƯƠNG TÁC GIAO DIỆN === */
        .mock-software {
            width: 100%; max-width: 600px; height: 350px;
            background: #eef2f3; border-radius: 8px; border: 2px solid #ccc;
            position: relative; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .hotspot {
            position: absolute; border: 3px dashed var(--secondary);
            background: rgba(255, 152, 80, 0.2); cursor: pointer;
            transition: all 0.2s; border-radius: 5px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: transparent;
        }
        .hotspot:hover { background: rgba(255, 152, 80, 0.4); }
        .hotspot.found {
            border: 3px solid var(--correct); background: rgba(74, 222, 128, 0.3);
            color: var(--text-main); cursor: default; pointer-events: none;
        }

        /* === MÀN 2, 3, 4: GÕ PHÍM === */
        .typing-container {
            width: 100%; text-align: center;
        }
        .task-indicator { margin-bottom: 20px; font-weight: bold; color: var(--accent); }
        .typing-text {
            font-size: 2.5rem; font-family: 'Courier New', Courier, monospace;
            background: white; padding: 20px 40px; border-radius: 15px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block; letter-spacing: 2px;
            position: relative;
        }
        .typing-text span { color: #aaa; transition: color 0.1s; }
        .typing-text span.correct { color: var(--correct); font-weight: bold; }
        .typing-text span.wrong { color: var(--wrong); background: rgba(248,113,113,0.2); }
        .typing-text span.current { color: var(--text-main); border-bottom: 3px solid var(--primary); }
        
        .keyboard-hint {
            margin-top: 30px; opacity: 0.7; width: 100%; max-width: 500px;
        }

        /* Màn 4 UI */
        .difficulty-select { display: flex; gap: 20px; margin-bottom: 20px; }
        
        /* Hiệu ứng báo lỗi / đúng */
        .flash-red { animation: flashRed 0.3s; }
        .flash-green { animation: flashGreen 0.3s; }
        @keyframes flashRed { 0% { background-color: rgba(248,113,113,0.3); } 100% { background-color: transparent; } }
        @keyframes flashGreen { 0% { background-color: rgba(74,222,128,0.3); } 100% { background-color: transparent; } }

        /* === MÀN KẾT THÚC === */
        #end-screen { align-items: center; justify-content: center; text-align: center; }
        .score-display { font-size: 5rem; color: var(--secondary); font-weight: bold; margin: 20px 0; text-shadow: 3px 3px 0 var(--highlight); }
        .badge { width: 120px; height: 120px; margin: 0 auto 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header/Thanh trạng thái (ẩn ở màn chào/kết) -->
    <header id="game-ui-header" style="display: none;">

    <!-- MÀN KẾT THÚC -->

<script>
/* ==========================================================================
   GAME CONFIGURATION (GIÁO VIÊN CÓ THỂ CHỈNH SỬA Ở ĐÂY)
   ========================================================================== */
const GAME_CONFIG = {
    totalLevels: 4,
    pointsPerLevel: 25,
    levels: [
        {
            id: 1,
            title: "Màn 1: Khám phá giao diện",
            desc: "Em hãy quan sát phần mềm mô phỏng và nhấn vào 3 khu vực: Chỗ chọn bài, Hướng dẫn ngón tay, và Nơi báo lỗi.",
            type: "click",
            targets: [
                { id: "hotspot-select", x: 2, y: 5, w: 25, h: 80, name: "Khu vực chọn bài" },
                { id: "hotspot-fingers", x: 30, y: 65, w: 65, h: 30, name: "Hướng dẫn ngón tay" },
                { id: "hotspot-error", x: 70, y: 5, w: 25, h: 15, name: "Nơi báo lỗi" }
            ],
            hint: "Tìm vùng danh sách bên trái, hình bàn tay ở dưới, và ô chữ đỏ góc trên phải."
        },
        {
            id: 2,
            title: "Màn 2: Khởi động ngón tay",
            desc: "Hãy gõ chính xác các phím (Tắt bộ gõ tiếng Việt trước khi chơi).",
            type: "typing",
            tasks: ["asdf jkl", "123 456", "qwer uiop"],
            hint: "Để ngón tay ở hàng phím cơ sở và gõ từ từ nhé."
        },
        {
            id: 3,
            title: "Màn 3: Thử thách phím Shift",
            desc: "Sử dụng phím Shift để gõ chữ in hoa và kí tự đặc biệt trên hàng số.",
            type: "typing",
            tasks: ["Hello", "Nam 2024!", "Tin hoc 4"],
            hint: "Giữ Shift bằng ngón út tay trái nếu gõ chữ bên phải và ngược lại."
        },
        {
            id: 4,
            title: "Màn 4: Bài tập tự chọn",
            desc: "Chọn một mức độ và hoàn thành bài luyện gõ cuối cùng.",
            type: "custom",
            difficulties: {
                easy: { label: "Dễ", text: "truong hoc la nha" },
                medium: { label: "Vừa", text: "em yeu mon tin hoc" },
                hard: { label: "Khó", text: "Luyen go phim bang 10 ngon!" }
            },
            hint: "Hãy tập trung cao độ, lỗi sẽ làm bạn chậm lại đấy."
        }
    ],
    messages: {
        welcome: "Chào cậu! Cùng luyện gõ 10 ngón nhé!",
        correct: "Giỏi quá!",
        wrong: "Cẩn thận lại nào!",
        levelUp: "Tuyệt vời! Chuyển màn thôi!",
        hint: "Để tớ gợi ý cho cậu nhé!"
    }
};

/* ==========================================================================
   AUDIO SYSTEM (Web Audio API - KHÔNG GIỌNG ĐỌC)
   ========================================================================== */
const audio = {
    ctx: null,
    bgmOsc: null,
    bgmGain: null,
    isBgmOn: true,
    isSfxOn: true,
    bgmInterval: null,
    noteIndex: 0,
    melody: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63], // C E G C G E

    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    
    playBGM: function() {
        if (!this.isBgmOn) return;
        this.init();
        this.stopBGM(); // Ensure no duplicates
        
        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.05; // Âm lượng nền rất nhỏ
        this.bgmGain.connect(this.ctx.destination);

        const playNote = () => {
            if(!this.isBgmOn) return;
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(this.melody[this.noteIndex], this.ctx.currentTime);
            
            const envelope = this.ctx.createGain();
            osc.connect(envelope);
            envelope.connect(this.bgmGain);
            
            envelope.gain.setValueAtTime(0, this.ctx.currentTime);
            envelope.gain.linearRampToValueAtTime(1, this.ctx.currentTime + 0.1);
            envelope.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            
            osc.start(this.ctx.currentTime);
            osc.stop(this.ctx.currentTime + 0.5);
            
            this.noteIndex = (this.noteIndex + 1) % this.melody.length;
        };

        playNote();
        this.bgmInterval = setInterval(playNote, 600); // Tốc độ bài nhạc
    },

    stopBGM: function() {
        if (this.bgmInterval) {
            clearInterval(this.bgmInterval);
            this.bgmInterval = null;
        }
    },

    toggleBGM: function() {
        this.isBgmOn = !this.isBgmOn;
        if (this.isBgmOn) {
            this.playBGM();
        } else {
            this.stopBGM();
        }
        return this.isBgmOn;
    },

    playSFX: function(type) {
        if (!this.isSfxOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        
        switch(type) {
            case 'correct':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
                break;
            case 'wrong':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                break;
            case 'click':
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 0.02);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
                break;
            case 'win':
                osc.type = 'square';
                [400, 500, 600, 800].forEach((freq, i) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.connect(g); g.connect(this.ctx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.2, now + i*0.1);
                    g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.3);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
                });
                break;
        }
    },
    
    toggleSFX: function() {
        this.isSfxOn = !this.isSfxOn;
        return this.isSfxOn;
    }
};

/* ==========================================================================
   GAME STATE & LOGIC
   ========================================================================== */
const state = {
    currentLevelIdx: 0,
    score: 0,
    levelCompleted: false,
    
    // Level 1 specific
    hotspotsFound: 0,
    
    // Level 2, 3, 4 specific
    typingTasks: [],
    currentTaskIdx: 0,
    currentTypingText: "",
    currentCharIdx: 0,
    isActiveTyping: false
};

// DOM Elements
const DOM = {
    screens: {
        welcome: document.getElementById('welcome-screen'),
        game: document.getElementById('game-screen'),
        end: document.getElementById('end-screen')
    },
    header: document.getElementById('game-ui-header'),
    levelTitle: document.getElementById('level-title'),
    levelDesc: document.getElementById('level-desc'),
    contentArea: document.getElementById('level-content-area'),
    speechBubble: document.getElementById('char-speech'),
    levelDisplay: document.getElementById('level-display'),
    scoreDisplay: document.getElementById('score-display'),
    
    btns: {
        start: document.getElementById('btn-start'),
        guide: document.getElementById('btn-guide'),
        bgm: document.getElementById('btn-bgm'),
        sfx: document.getElementById('btn-sfx'),
        home: document.getElementById('btn-home'),
        hint: document.getElementById('btn-hint'),
        retry: document.getElementById('btn-retry-level'),
        next: document.getElementById('btn-next'),
        replayGame: document.getElementById('btn-replay-game')
    }
};

/* --- CORE FUNCTIONS --- */
function showScreen(screenName) {
    Object.values(DOM.screens).forEach(s => s.classList.remove('active'));
    DOM.screens[screenName].classList.add('active');
    
    if (screenName === 'game') {
        DOM.header.style.display = 'flex';
    } else {
        DOM.header.style.display = 'none';
        state.isActiveTyping = false;
    }
}

function updateStats() {
    DOM.levelDisplay.innerText = `Màn: ${state.currentLevelIdx + 1}/${GAME_CONFIG.totalLevels}`;
    DOM.scoreDisplay.innerText = `Điểm: ${state.score}`;
}

function speak(text, duration = 3000) {
    DOM.speechBubble.innerText = text;
    DOM.speechBubble.classList.add('show');
    clearTimeout(state.speechTimeout);
    state.speechTimeout = setTimeout(() => {
        DOM.speechBubble.classList.remove('show');
    }, duration);
}

function startGame() {
    audio.init();
    audio.playBGM();
    audio.playSFX('click');
    state.currentLevelIdx = 0;
    state.score = 0;
    loadLevel();
}

function loadLevel() {
    showScreen('game');
    updateStats();
    state.levelCompleted = false;
    state.isActiveTyping = false;
    DOM.btns.next.disabled = true;
    
    const levelConfig = GAME_CONFIG.levels[state.currentLevelIdx];
    DOM.levelTitle.innerText = levelConfig.title;
    DOM.levelDesc.innerText = levelConfig.desc;
    DOM.contentArea.innerHTML = ''; // Clear old content
    DOM.contentArea.className = 'game-content'; // Reset classes
    
    speak(GAME_CONFIG.messages.welcome);

    if (levelConfig.type === 'click') {
        buildLevel1(levelConfig);
    } else if (levelConfig.type === 'typing') {
        buildLevelTyping(levelConfig);
    } else if (levelConfig.type === 'custom') {
        buildLevel4(levelConfig);
    }
}

function completeLevel() {
    if (state.levelCompleted) return;
    state.levelCompleted = true;
    state.isActiveTyping = false;
    state.score += GAME_CONFIG.pointsPerLevel;
    updateStats();
    audio.playSFX('win');
    speak(GAME_CONFIG.messages.levelUp);
    DOM.btns.next.disabled = false;
    DOM.contentArea.classList.add('flash-green');
    setTimeout(() => DOM.contentArea.classList.remove('flash-green'), 300);
}

function nextLevel() {
    audio.playSFX('click');
    state.currentLevelIdx++;
    if (state.currentLevelIdx < GAME_CONFIG.totalLevels) {
        loadLevel();
    } else {
        endGame();
    }
}

function endGame() {
    showScreen('end');
    audio.stopBGM();
    audio.playSFX('win');
    document.getElementById('final-score').innerText = state.score;
}

/* --- LEVEL 1: MOCK INTERFACE --- */
function buildLevel1(config) {
    state.hotspotsFound = 0;
    
    // Tạo SVG mô phỏng phần mềm
    const svgHTML = `
        <div class="mock-software">
            <!-- Sidebar -->
            <div style="position: absolute; left: 0; top: 0; width: 25%; height: 100%; background: #ddd; border-right: 1px solid #ccc; padding: 10px;">
                <div style="background:#bbb; height:20px; width:80%; margin-bottom:10px; border-radius:3px;"></div>
                <div style="background:#bbb; height:20px; width:60%; margin-bottom:10px; border-radius:3px;"></div>
            </div>
            <!-- Top bar -->
            <div style="position: absolute; left: 25%; top: 0; width: 75%; height: 40px; background: #fff; border-bottom: 1px solid #ccc; display:flex; justify-content: flex-end; padding:10px;">
                <div style="color: red; font-weight:bold; font-size:12px;">Lỗi: 0</div>
            </div>
            <!-- Main Area -->
            <div style="position: absolute; left: 25%; top: 40px; width: 75%; height: 60%; display:flex; justify-content:center; align-items:center; font-size:24px; letter-spacing:3px;">
                a s d f 
            </div>
            <!-- Bottom Keyboard -->
            <div style="position: absolute; left: 25%; bottom: 0; width: 75%; height: 35%; background: #e5e5e5; border-top: 1px solid #ccc; display:flex; justify-content:center; align-items:center;">
                <!-- SVG Bàn tay giả lập -->
                <svg width="200" height="80" viewBox="0 0 200 80">
                    <path d="M 20 80 Q 20 30 40 30 Q 60 30 60 80 M 60 80 Q 60 20 80 20 Q 100 20 100 80" fill="none" stroke="#999" stroke-width="5"/>
                    <path d="M 180 80 Q 180 30 160 30 Q 140 30 140 80 M 140 80 Q 140 20 120 20 Q 100 20 100 80" fill="none" stroke="#999" stroke-width="5"/>
                </svg>
            </div>
            
            ${config.targets.map(t => `
                <div class="hotspot" id="${t.id}" style="left: ${t.x}%; top: ${t.y}%; width: ${t.w}%; height: ${t.h}%;" data-name="${t.name}"></div>
            `).join('')}
        </div>
    `;
    DOM.contentArea.innerHTML = svgHTML;

    // Attach events
    config.targets.forEach(t => {
        const el = document.getElementById(t.id);
        el.addEventListener('click', function() {
            if (!this.classList.contains('found')) {
                audio.playSFX('correct');
                this.classList.add('found');
                this.innerText = "✓";
                state.hotspotsFound++;
                speak(`Đúng rồi! Đây là ${this.getAttribute('data-name')}.`);
                
                if (state.hotspotsFound === config.targets.length) {
                    setTimeout(completeLevel, 500);
                }
            }
        });
    });
}

/* --- LEVEL 2 & 3: TYPING --- */
function buildLevelTyping(config) {
    state.typingTasks = config.tasks;
    state.currentTaskIdx = 0;
    renderTypingTask();
}

function renderTypingTask() {
    if (state.currentTaskIdx >= state.typingTasks.length) {
        completeLevel();
        return;
    }

    state.currentTypingText = state.typingTasks[state.currentTaskIdx];
    state.currentCharIdx = 0;
    state.isActiveTyping = true;

    let html = `<div class="typing-container">
        <div class="task-indicator">Đoạn ${state.currentTaskIdx + 1}/${state.typingTasks.length}</div>
        <div class="typing-text" id="typing-box">`;
    
    for(let i=0; i<state.currentTypingText.length; i++) {
        html += `<span id="char-${i}">${state.currentTypingText[i]}</span>`;
    }
    html += `</div>
        <div class="keyboard-hint">
            <svg viewBox="0 0 400 100" style="width:100%;">
                <rect x="10" y="10" width="380" height="80" rx="5" fill="#f0f0f0" stroke="#ccc"/>
                <text x="200" y="55" text-anchor="middle" fill="#888" font-size="14">Gõ theo kí tự có gạch chân. Chú ý khoảng trắng.</text>
            </svg>
        </div>
    </div>`;
    
    DOM.contentArea.innerHTML = html;
    updateTypingUI();
}

function updateTypingUI() {
    for(let i=0; i<state.currentTypingText.length; i++) {
        const span = document.getElementById(`char-${i}`);
        span.className = '';
        if (i < state.currentCharIdx) {
            span.classList.add('correct');
        } else if (i === state.currentCharIdx) {
            span.classList.add('current');
        }
    }
}

// Global Keydown listener
document.addEventListener('keydown', (e) => {
    if (!state.isActiveTyping) return;
    
    // Ignore modifier keys
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) return;

    const targetChar = state.currentTypingText[state.currentCharIdx];
    
    if (e.key === targetChar) {
        audio.playSFX('correct');
        state.currentCharIdx++;
        updateTypingUI();
        
        if (state.currentCharIdx === state.currentTypingText.length) {
            state.isActiveTyping = false; // pause accepting input
            setTimeout(() => {
                state.currentTaskIdx++;
                renderTypingTask();
            }, 500);
        }
    } else {
        // Sai
        audio.playSFX('wrong');
        const span = document.getElementById(`char-${state.currentCharIdx}`);
        span.classList.add('wrong');
        DOM.contentArea.classList.add('flash-red');
        speak(GAME_CONFIG.messages.wrong, 1500);
        setTimeout(() => {
            span.classList.remove('wrong');
            DOM.contentArea.classList.remove('flash-red');
        }, 300);
    }
});

/* --- LEVEL 4: CUSTOM DIFFICULTY --- */
function buildLevel4(config) {
    let html = `<div class="typing-container">
        <h3 style="margin-bottom:20px; color:var(--primary)">Chọn mức độ:</h3>
        <div class="difficulty-select">
            <button class="btn-primary" onclick="startCustomTask('easy')">${config.difficulties.easy.label}</button>
            <button class="btn-secondary" onclick="startCustomTask('medium')">${config.difficulties.medium.label}</button>
            <button class="btn-accent" onclick="startCustomTask('hard')">${config.difficulties.hard.label}</button>
        </div>
    </div>`;
    DOM.contentArea.innerHTML = html;
}

window.startCustomTask = function(levelKey) {
    audio.playSFX('click');
    const config = GAME_CONFIG.levels[3];
    state.typingTasks = [config.difficulties[levelKey].text];
    state.currentTaskIdx = 0;
    renderTypingTask();
};

/* --- EVENT LISTENERS UI --- */
DOM.btns.start.addEventListener('click', startGame);

DOM.btns.guide.addEventListener('click', () => {
    alert("HƯỚNG DẪN:\n- Sử dụng chuột để nháy chọn vùng màn hình theo yêu cầu.\n- Sử dụng bàn phím để gõ chính xác các đoạn văn bản.\n- Tắt bộ gõ tiếng Việt (Unikey/EVKey) trước khi chơi màn gõ phím.\n- Nhấn nút Gợi ý nếu gặp khó khăn.");
});

DOM.btns.bgm.addEventListener('click', function() {
    const isOn = audio.toggleBGM();
    this.style.opacity = isOn ? '1' : '0.5';
    this.innerText = isOn ? '🎵' : '🔇';
});

DOM.btns.sfx.addEventListener('click', function() {
    const isOn = audio.toggleSFX();
    this.style.opacity = isOn ? '1' : '0.5';
});

DOM.btns.home.addEventListener('click', () => {
    audio.playSFX('click');
    audio.stopBGM();
    showScreen('welcome');
});

DOM.btns.next.addEventListener('click', nextLevel);

DOM.btns.retry.addEventListener('click', () => {
    audio.playSFX('click');
    loadLevel(); // Reload current level
});

DOM.btns.replayGame.addEventListener('click', () => {
    audio.playSFX('click');
    showScreen('welcome');
});

DOM.btns.hint.addEventListener('click', () => {
    audio.playSFX('click');
    const hintText = GAME_CONFIG.levels[state.currentLevelIdx].hint;
    speak(hintText, 5000);
});

// Xử lý khi ẩn tab không phát nhạc chồng chéo
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === 'hidden') {
        if(audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend();
    } else {
        if(audio.ctx && audio.ctx.state === 'suspended' && DOM.screens.game.classList.contains('active')) {
            audio.ctx.resume();
        }
    }
});

</script>
