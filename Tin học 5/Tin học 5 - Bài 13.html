<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ngã Rẽ Thông Minh - Tin Học 5 Bài 13: Cấu Trúc Rẽ Nhánh</title>
  <style>
    :root {
      --bg-cream: #FFFDF9;
      --bg-peach: #FFF0E5;
      --bg-mint: #E8FBF5;
      --bg-lavender: #F3EEFF;
      --primary-purple: #8B6BF2;
      --primary-purple-dark: #6846D6;
      --accent-orange: #FF9F4A;
      --accent-orange-dark: #E07B22;
      --accent-pink: #FF7597;
      --accent-mint: #2EC492;
      --accent-mint-dark: #1E9970;
      --scratch-control: #FFAB19;
      --scratch-control-border: #CF8B17;
      --scratch-sensing: #5CB1D6;
      --scratch-sensing-border: #3B8EB2;
      --scratch-looks: #9966FF;
      --scratch-looks-border: #774DCB;
      --text-main: #283655;
      --text-muted: #5C6B8A;
      --card-bg: #FFFFFF;
      --card-border: #E5E0FA;
      --shadow-soft: 0 10px 28px rgba(104, 70, 214, 0.10);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Segoe UI", "Nunito", "Quicksand", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #FFF8F0 0%, #F1ECFF 52%, #E8FBF8 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      position: relative;
    }

    /* Background decorations */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      filter: drop-shadow(0 6px 14px rgba(165, 140, 247, 0.12));
    }
    .cloud-1 { width: 150px; height: 48px; top: 7%; left: 4%; }
    .cloud-2 { width: 190px; height: 56px; top: 14%; right: 5%; }
    .cloud-3 { width: 130px; height: 42px; bottom: 8%; left: 8%; }

    /* Main Wrapper */
    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      padding: 12px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
    }

    /* Top Header */
    .top-header {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 26px;
      padding: 10px 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #FFB672, #FF85A2);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(255, 133, 162, 0.35);
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--primary-purple-dark);
      letter-spacing: -0.2px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Candy Progress Bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F7F4FF;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2px solid #E5DEFF;
    }
    .stage-pill {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      background: #fff;
      border: 2px solid #E2DCFA;
      transition: all 0.25s ease;
      cursor: pointer;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .stage-pill.active {
      background: linear-gradient(135deg, #8B6BF2, #A58CF7);
      color: #fff;
      border-color: #6846D6;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(139, 107, 242, 0.35);
    }
    .stage-pill.done {
      background: #E8FBF5;
      color: #16805C;
      border-color: #2EC492;
    }

    /* Header Actions & Score */
    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .score-pill {
      background: linear-gradient(135deg, #FFF5D6, #FFE099);
      border: 2px solid #F7B731;
      color: #8A5200;
      font-weight: 900;
      font-size: 15px;
      padding: 7px 15px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #E59E1A;
    }

    /* Candy 3D Buttons */
    .btn-candy {
      appearance: none;
      border: none;
      border-radius: 16px;
      padding: 9px 15px;
      min-height: 44px;
      min-width: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      color: var(--text-main);
      background: #F4F1FF;
      border: 2px solid #D8CEFF;
      box-shadow: 0 4px 0 #C5B6FA;
    }
    .btn-candy:hover:not(:disabled) {
      filter: brightness(1.03);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #C5B6FA;
    }
    .btn-candy:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #C5B6FA;
    }
    .btn-candy:focus-visible {
      outline: 3px solid #FF9F4A;
      outline-offset: 2px;
    }
    .btn-candy:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(180deg, #9C7SF8 0%, #7C5CE6 100%);
      background-color: #8B6BF2;
      color: #fff;
      border-color: #5E3DC4;
      box-shadow: 0 5px 0 #5E3DC4;
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 7px 0 #5E3DC4; }
    .btn-primary:active:not(:disabled) { box-shadow: 0 2px 0 #5E3DC4; }

    .btn-orange {
      background: linear-gradient(180deg, #FFB366 0%, #FF942E 100%);
      color: #fff;
      border-color: #D46B08;
      box-shadow: 0 5px 0 #D46B08;
    }
    .btn-orange:hover:not(:disabled) { box-shadow: 0 7px 0 #D46B08; }
    .btn-orange:active:not(:disabled) { box-shadow: 0 2px 0 #D46B08; }

    .btn-mint {
      background: linear-gradient(180deg, #42DBA7 0%, #24B886 100%);
      color: #fff;
      border-color: #168A62;
      box-shadow: 0 5px 0 #168A62;
    }
    .btn-mint:hover:not(:disabled) { box-shadow: 0 7px 0 #168A62; }
    .btn-mint:active:not(:disabled) { box-shadow: 0 2px 0 #168A62; }

    .btn-toggle-on {
      background: #E8FBF5;
      border-color: #2EC492;
      color: #127855;
      box-shadow: 0 4px 0 #8CE3C6;
    }
    .btn-toggle-off {
      background: #FFF0F3;
      border-color: #FF8FA3;
      color: #A82843;
      box-shadow: 0 4px 0 #F7B5C2;
    }

    /* Welcome Screen */
    .welcome-card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 34px;
      padding: 28px;
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 28px;
      align-items: center;
      margin: auto 0;
    }
    .welcome-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFF0E5;
      color: #C85A00;
      border: 2px solid #FFD0B0;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .welcome-title {
      font-size: clamp(28px, 3.6vw, 44px);
      font-weight: 900;
      color: #5135B8;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .welcome-sub {
      font-size: 17px;
      color: var(--text-main);
      font-weight: 600;
      margin-bottom: 18px;
    }
    .goal-list {
      background: #F8F6FF;
      border: 2px dashed #C8BAFA;
      border-radius: 22px;
      padding: 16px 20px;
      margin-bottom: 22px;
    }
    .goal-list h3 {
      font-size: 16px;
      color: #5E3DC4;
      margin-bottom: 8px;
    }
    .goal-list ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .goal-list li {
      font-size: 15px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-weight: 600;
    }
    .welcome-art {
      background: linear-gradient(180deg, #F3EEFF 0%, #FFF7EB 100%);
      border: 3px solid #E1D6FF;
      border-radius: 28px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 360px;
    }

    /* Main Stage Workspace (2 columns) */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      align-items: start;
      flex: 1;
    }

    .panel-card {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 28px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px dashed #ECE7FF;
      padding-bottom: 10px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 900;
      color: #4E35B0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sim-badge {
      font-size: 12px;
      font-weight: 700;
      background: #EEF6FF;
      color: #1D5FA7;
      border: 1.5px solid #B8D8FA;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Interactive Cat Stage */
    .scratch-stage {
      background: linear-gradient(180deg, #EBF5FF 0%, #FFF9F0 100%);
      border: 3px solid #D3E4FA;
      border-radius: 24px;
      min-height: 270px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .scratch-stage.touching-active {
      border-color: #9966FF;
      box-shadow: 0 0 0 4px rgba(153, 102, 255, 0.18);
    }

    .stage-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .sensor-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      background: #fff;
      border: 2px solid #CBD5E1;
      transition: all 0.2s ease;
    }
    .sensor-pill.true-state {
      background: #E8FBF5;
      border-color: #2EC492;
      color: #0D704E;
    }
    .sensor-pill.false-state {
      background: #FFF3E6;
      border-color: #FF9F4A;
      color: #9C4B00;
    }

    .cat-hitbox {
      position: relative;
      width: 190px;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 24px;
      transition: transform 0.2s ease;
      z-index: 2;
    }
    .cat-hitbox:hover {
      transform: scale(1.03);
    }
    .cat-speech {
      position: absolute;
      top: -8px;
      right: -36px;
      background: #fff;
      border: 2.5px solid #8B6BF2;
      color: #3D288C;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 16px 16px 16px 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      pointer-events: none;
      white-space: nowrap;
    }

    .stage-touch-controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 2;
      flex-wrap: wrap;
    }

    /* Flowchart visual */
    .flowchart-box {
      background: #FBF9FF;
      border: 2px solid #E5DEFF;
      border-radius: 20px;
      padding: 12px;
    }
    .flowchart-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 6px;
    }

    /* Mascot Chibi Companion */
    .mascot-bar {
      background: linear-gradient(135deg, #FFF7EB 0%, #F5F0FF 100%);
      border: 2.5px solid #E2D6FF;
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mascot-avatar {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }
    .mascot-bubble {
      flex: 1;
      background: #FFFFFF;
      border: 2px solid #D7C8FF;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      position: relative;
    }
    .mascot-bubble.good {
      background: #ECFDF7;
      border-color: #2EC492;
      color: #0E6245;
    }
    .mascot-bubble.warn {
      background: #FFF6ED;
      border-color: #FF9F4A;
      color: #8F4200;
    }

    /* Scratch Puzzle Blocks Styling */
    .scratch-c-block {
      background: var(--scratch-control);
      border: 3px solid var(--scratch-control-border);
      border-radius: 16px;
      padding: 12px;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 5px 0 var(--scratch-control-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .c-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 15px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .hex-slot {
      min-width: 195px;
      min-height: 44px;
      background: rgba(0, 0, 0, 0.22);
      border: 2px dashed rgba(255, 255, 255, 0.85);
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #FFF6E0;
      font-size: 13px;
    }
    .hex-slot.highlight-slot, .mouth-slot.highlight-slot {
      background: rgba(255, 255, 255, 0.35);
      border-color: #FFF;
      transform: scale(1.02);
    }
    .mouth-slot {
      margin-left: 18px;
      background: #FFFDF9;
      border: 2.5px dashed #C7B8EA;
      border-radius: 12px;
      min-height: 54px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    /* Draggable / Selectable Blocks */
    .block-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: #F6F3FF;
      border: 2px solid #E2DAFF;
      border-radius: 18px;
    }
    .puzzle-piece {
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      padding: 10px 16px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .puzzle-piece:hover {
      transform: translateY(-2px);
    }
    .puzzle-piece.selected-piece {
      outline: 4px solid #FF9F4A;
      outline-offset: 2px;
      transform: scale(1.04);
    }
    .piece-sensing {
      background: var(--scratch-sensing);
      border: 2px solid var(--scratch-sensing-border);
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
      padding: 8px 22px;
    }
    .piece-looks {
      background: var(--scratch-looks);
      border: 2px solid var(--scratch-looks-border);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--scratch-looks-border);
    }
    .piece-control-choice {
      background: var(--scratch-control);
      border: 2px solid var(--scratch-control-border);
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--scratch-control-border);
      color: #fff;
    }

    /* Checklist & Question Cards */
    .checklist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .check-item {
      background: #F9F7FF;
      border: 2px solid #E0D8FA;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .check-item.done {
      background: #E8FBF5;
      border-color: #2EC492;
      color: #0E694B;
    }

    .quiz-card {
      background: #FFFDF8;
      border: 2px solid #F3DEC2;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quiz-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .option-btn {
      flex: 1 1 210px;
      text-align: left;
      background: #FFFFFF;
      border: 2px solid #D5CCF5;
      border-radius: 14px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      min-height: 44px;
      transition: all 0.15s ease;
    }
    .option-btn:hover {
      background: #F4F0FF;
      border-color: #8B6BF2;
    }
    .option-btn.correct {
      background: #E8FBF5;
      border-color: #2EC492;
      color: #0C6346;
    }
    .option-btn.wrong {
      background: #FFF0F3;
      border-color: #FF7597;
      color: #9E1F3F;
      animation: gentleShake 0.35s ease;
    }

    .stage-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 2px dashed #ECE7FF;
    }

    /* Summary Screen */
    .summary-card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 32px;
      padding: 28px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      text-align: center;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      text-align: left;
    }
    .knowledge-box {
      background: #F8F5FF;
      border: 2px solid #DCD0FF;
      border-radius: 22px;
      padding: 18px;
    }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 54, 85, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border: 4px solid #D8CEFF;
      border-radius: 28px;
      max-width: 580px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: popIn 0.28s ease forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 980px) {
      .welcome-card, .game-layout, .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Decorative Pastel Clouds -->
  <div class="bg-decor" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div class="app-shell">
    <!-- TOP HEADER BAR -->
    <header class="top-header" role="banner">
      <div class="brand-group">
        <span class="brand-badge">TIN HỌC 5 • BÀI 13</span>
        <div>

    /* ==========================================================================
       2. SOUND ENGINE: Web Audio API (Nhạc nền & SFX nguyên gốc, KHÔNG giọng đọc)
       ========================================================================== */
    const SoundEngine = {
      ctx: null,
      bgmEnabled: true,
      sfxEnabled: true,
      bgmTimer: null,
      bgmStep: 0,
      isPlayingBgm: false,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },

      playTone(freq, duration = 0.14, type = "sine", gainVal = 0.08, delay = 0) {
        if (!this.sfxEnabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      },

      sfxClick() {
        this.playTone(520, 0.07, "triangle", 0.06);
      },
      sfxSnap() {
        this.playTone(440, 0.06, "sine", 0.07, 0);
        this.playTone(660, 0.09, "triangle", 0.08, 0.05);
      },
      sfxCondition(isTrue) {
        if (isTrue) {
          this.playTone(587.33, 0.09, "sine", 0.06, 0);
          this.playTone(880, 0.12, "sine", 0.06, 0.07);
        } else {
          this.playTone(440, 0.1, "sine", 0.05, 0);
        }
      },
      sfxCorrect() {
        this.playTone(523.25, 0.11, "triangle", 0.09, 0);
        this.playTone(659.25, 0.11, "triangle", 0.09, 0.09);
        this.playTone(783.99, 0.18, "triangle", 0.10, 0.18);
      },
      sfxWrong() {
        this.playTone(310, 0.14, "sine", 0.07, 0);
        this.playTone(260, 0.18, "sine", 0.07, 0.12);
      },
      sfxStageClear() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => this.playTone(n, 0.16, "triangle", 0.1, idx * 0.09));
      },

      startBgm() {
        this.stopBgm();
        if (!this.bgmEnabled) return;
        this.init();
        if (!this.ctx) return;
        this.isPlayingBgm = true;
        // Giai điệu pentatonic vui tươi nhẹ nhàng
        const melody = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 392.00];
        this.bgmTimer = setInterval(() => {
          if (!this.bgmEnabled || document.hidden || !this.ctx) return;
          const note = melody[this.bgmStep % melody.length];
          this.bgmStep++;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(note, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.022, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.38);
          } catch (e) {}
        }, 450);
      },

      stopBgm() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
        this.isPlayingBgm = false;
      },

      toggleBgm() {
        this.bgmEnabled = !this.bgmEnabled;
        const btn = document.getElementById("btnBgm");
        if (this.bgmEnabled) {
          btn.textContent = "🎵 Nhạc nền: BẬT";
          btn.className = "btn-candy btn-toggle-on";
          this.startBgm();
        } else {
          btn.textContent = "🔇 Nhạc nền: TẮT";
          btn.className = "btn-candy btn-toggle-off";
          this.stopBgm();
        }
      },

      toggleSfx() {
        this.sfxEnabled = !this.sfxEnabled;
        const btn = document.getElementById("btnSfx");
        if (this.sfxEnabled) {
          btn.textContent = "🔔 Hiệu ứng: BẬT";
          btn.className = "btn-candy btn-toggle-on";
          this.sfxClick();
        } else {
          btn.textContent = "🔕 Hiệu ứng: TẮT";
          btn.className = "btn-candy btn-toggle-off";
        }
      }
    };

    document.addEventListener("visibilitychange", () => {

        SoundEngine.stopBgm();

        SoundEngine.startBgm();

            <!-- Đường nối -->
            <path d="M 155 42 L 85 42 L 85 92" fill="none" stroke="${trueStroke}" stroke-width="${trueActive ? 4 : 2.5}"/>
            <path d="M 305 42 L 375 42 L 375 92" fill="none" stroke="${falseStroke}" stroke-width="${falseActive ? 4 : 2.5}"/>

            <!-- Nhãn ĐÚNG / SAI -->
            <rect x="92" y="22" width="48" height="20" rx="8" fill="#E8FBF5" stroke="#2EC492" stroke-width="1.5"/>
            <text x="116" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#0D704E">ĐÚNG</text>

            <rect x="320" y="22" width="44" height="20" rx="8" fill="#FFF3E6" stroke="#FF9F4A" stroke-width="1.5"/>
            <text x="342" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#9C4B00">SAI</text>

            <!-- Hình thoi Điều kiện -->
            <polygon points="230,10 312,42 230,74 148,42" fill="#E0F4FF" stroke="#3B8EB2" stroke-width="3"/>
            <text x="230" y="39" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1E3A5F">Đang chạm</text>
            <text x="230" y="53" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1E3A5F">con trỏ chuột?</text>

            <!-- Nhánh ĐÚNG (Trái) -->
            <rect x="16" y="92" width="142" height="44" rx="12" fill="${trueBg}" stroke="${trueStroke}" stroke-width="3"/>
            <text x="87" y="118" text-anchor="middle" font-size="12" font-weight="800" fill="#1E293B">✨ Đổi sang màu Tím</text>

            <!-- Nhánh SAI (Phải) -->
            <rect x="302" y="92" width="142" height="44" rx="12" fill="${falseBg}" stroke="${falseStroke}" stroke-width="3"/>
            <text x="373" y="118" text-anchor="middle" font-size="12" font-weight="800" fill="#1E293B">${rightLabel}</text>
          </svg>
        `;
      }
    };

    /* ==========================================================================
       4. MAIN APPLICATION CONTROLLER
       ========================================================================== */
    const GameApp = {
      hasStarted: false,
      currentScreen: "welcome", // welcome | stage1 | stage2 | stage3 | stage4 | summary
      currentStage: 1,
      stageCompleted: { 1: false, 2: false, 3: false, 4: false },
      mascotState: { mood: "welcome", message: "Chào mừng em đến với phòng thí nghiệm Ngã Rẽ Thông Minh!" },

      // Trạng thái sân khấu mèo
      isPointerTouchingCat: false,
      catColor: "orange", // orange | purple

      // Trạng thái riêng từng màn
      s1: {
        triedTouch: false,
        triedLeave: false,
        q1Answered: false,
        q2Answered: false
      },
      s2: {
        selectedControl: null, // "if_then" | "repeat_10" | "wait_1"
        conditionBlock: null,  // "touching_mouse" | "key_space"
        actionBlock: null,     // "set_purple" | "say_hello"
        selectedPaletteItem: null,
        isProgramRunning: false,
        testedTouchAfterRun: false
      },
      s3: {
        conditionBlock: null,  // "touching_mouse" | "key_space"
        thenBlock: null,       // "set_purple" | "clear_orange"
        elseBlock: null,       // "set_purple" | "clear_orange"
        selectedPaletteItem: null,
        isProgramRunning: false,
        testedTrueBranch: false,
        testedFalseBranch: false
      },
      s4: {
        // Ban đầu bị ngược: nhánh ĐÚNG lại là "clear_orange", nhánh SAI lại là "set_purple"
        thenBlock: "clear_orange",
        elseBlock: "set_purple",
        isProgramRunning: false,
        testedTrueAfterFix: false,
        testedFalseAfterFix: false
      },

      init() {
        this.updateHeaderUI();
        this.renderWelcome();
      },

      getTotalScore() {
        let count = 0;
        for (let i = 1; i <= 4; i++) {
          if (this.stageCompleted[i]) count += GAME_CONFIG.pointsPerStage;
        }
        return count;
      },

      updateHeaderUI() {
        document.getElementById("scoreDisplay").textContent = `${this.getTotalScore()} / 100`;
        for (let i = 1; i <= 4; i++) {
          const pill = document.getElementById(`pill-${i}`);
          if (!pill) continue;
          pill.classList.remove("active", "done");
          if (this.currentScreen === `stage${i}`) {
            pill.classList.add("active");
          } else if (this.stageCompleted[i]) {
            pill.classList.add("done");
          }
          pill.innerHTML = `${this.stageCompleted[i] ? "✅" : i + "."} ${["Điều kiện", "Dạng thiếu", "Dạng đủ", "Sửa lệnh"][i - 1]}`;
        }
      },

      setMascot(mood, message) {
        this.mascotState = { mood, message };
        const avatarEl = document.getElementById("mascotAvatarBox");
        const bubbleEl = document.getElementById("mascotBubbleBox");
        if (avatarEl) avatarEl.innerHTML = SvgFactory.getMascotSvg(mood);
        if (bubbleEl) {
          bubbleEl.textContent = message;
          bubbleEl.className = "mascot-bubble " + (mood === "celebrate" ? "good" : mood === "encourage" ? "warn" : "");
        }
      },

      startGame() {
        SoundEngine.init();
        SoundEngine.sfxClick();
        if (!this.hasStarted) {
          this.hasStarted = true;
          SoundEngine.startBgm();
        }
        this.loadStage(1);
      },

      goHome() {
        SoundEngine.sfxClick();
        this.currentScreen = "welcome";
        this.updateHeaderUI();
        this.renderWelcome();
      },

      jumpToStage(stageNum) {
        SoundEngine.sfxClick();
        if (!this.hasStarted) {
          this.hasStarted = true;
          SoundEngine.startBgm();
        }
        this.loadStage(stageNum);
      },

      resetCurrentStage() {
        SoundEngine.sfxClick();
        if (this.currentScreen.startsWith("stage")) {
          this.initStageState(this.currentStage);
          this.renderStage(this.currentStage);
        } else {
          this.goHome();
        }
      },

      initStageState(stageNum) {
        this.isPointerTouchingCat = false;
        this.catColor = "orange";

        if (stageNum === 1) {
          this.s1 = { triedTouch: false, triedLeave: false, q1Answered: false, q2Answered: false };
          this.mascotState = { mood: "welcome", message: GAME_CONFIG.stages[1].goal };
        } else if (stageNum === 2) {
          this.s2 = {
            selectedControl: null,
            conditionBlock: null,
            actionBlock: null,
            selectedPaletteItem: null,
            isProgramRunning: false,
            testedTouchAfterRun: false
          };
          this.mascotState = { mood: "welcome", message: GAME_CONFIG.stages[2].goal };
        } else if (stageNum === 3) {
          this.s3 = {
            conditionBlock: null,
            thenBlock: null,
            elseBlock: null,
            selectedPaletteItem: null,
            isProgramRunning: false,
            testedTrueBranch: false,
            testedFalseBranch: false
          };
          this.mascotState = { mood: "welcome", message: GAME_CONFIG.stages[3].goal };
        } else if (stageNum === 4) {
          this.s4 = {
            thenBlock: "clear_orange",
            elseBlock: "set_purple",
            isProgramRunning: false,
            testedTrueAfterFix: false,
            testedFalseAfterFix: false
          };
          this.mascotState = { mood: "welcome", message: GAME_CONFIG.stages[4].goal };
        }
      },

      loadStage(stageNum) {
        this.currentStage = stageNum;
        this.currentScreen = `stage${stageNum}`;
        this.initStageState(stageNum);
        this.updateHeaderUI();
        this.renderStage(stageNum);
      },

      nextStage() {
        SoundEngine.sfxClick();
        if (this.currentStage < 4) {
          this.loadStage(this.currentStage + 1);
        } else {
          this.currentScreen = "summary";
          this.updateHeaderUI();
          SoundEngine.sfxStageClear();
          this.renderSummary();
        }
      },

      completeStage(stageNum, message) {
        const firstTime = !this.stageCompleted[stageNum];
        this.stageCompleted[stageNum] = true;
        if (firstTime) {
          SoundEngine.sfxStageClear();
        } else {
          SoundEngine.sfxCorrect();
        }
        this.updateHeaderUI();
        this.setMascot("celebrate", message);
        const nextBtn = document.getElementById("btnNextStage");
        if (nextBtn) {
          nextBtn.disabled = false;
        }
      },

      /* ========================================================================
         RENDER MÀN CHÀO MỪNG
         ======================================================================== */
      renderWelcome() {
        const viewport = document.getElementById("mainViewport");
        viewport.innerHTML = `
          <section class="welcome-card animate-pop">
            <div>
              <div class="welcome-tag">✨ Sách Kết nối tri thức với cuộc sống • Trang 62–66</div>
              <h1 class="welcome-title">NGÃ RẼ THÔNG MINH</h1>
              <p class="welcome-sub">Khám phá <strong>Cấu trúc rẽ nhánh</strong> cùng Chú Mèo Lập Trình trong phòng thí nghiệm Scratch diệu kỳ!</p>

              <div class="goal-list">
                <h3>🎯 Sau bài học này em sẽ:</h3>
                <ul>
                  <li>✅ Nhận biết được điều kiện <strong>ĐÚNG / SAI</strong> và sơ đồ cấu trúc rẽ nhánh.</li>
                  <li>✅ Lắp ghép được khối lệnh <strong>rẽ nhánh dạng thiếu</strong> (<code>nếu ... thì ...</code>).</li>
                  <li>✅ Lắp ghép được khối lệnh <strong>rẽ nhánh dạng đủ</strong> (<code>nếu ... thì ... nếu không thì ...</code>).</li>
                  <li>✅ Biết tìm lỗi và sửa chương trình điều khiển chú Mèo đổi màu chính xác.</li>
                </ul>
              </div>

              <div style="display:flex; flex-wrap:wrap; gap:12px;">
                <button class="btn-candy btn-primary" style="font-size:18px; padding:14px 28px;" onclick="GameApp.startGame()" type="button">
                  🚀 BẮT ĐẦU CHƠI NGAY
                </button>
                <button class="btn-candy btn-orange" style="font-size:16px; padding:14px 22px;" onclick="GameApp.showGuideModal()" type="button">
                  📖 Hướng dẫn cách chơi
                </button>
              </div>
            </div>

            <div class="welcome-art">
              <div style="display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
                ${SvgFactory.getCatSvg("orange", false)}
                <div style="font-size:28px; font-weight:900; color:#8B6BF2;">⇄</div>
                ${SvgFactory.getCatSvg("purple", true)}
              </div>
              <div style="width:100%; margin-top:12px;">
                ${SvgFactory.getFlowchartSvg(true, "full", "Về màu Cam")}
              </div>
              <div style="margin-top:8px; font-size:13px; font-weight:800; color:#5E3DC4; background:#fff; padding:6px 14px; border-radius:999px; border:2px solid #D8CEFF;">
                Giao diện mô phỏng phục vụ học tập • Hoạt động 100% Offline
              </div>
            </div>
          </section>
        `;
      },

      /* ========================================================================
         XỬ LÝ TƯƠNG TÁC CON TRỎ CHUỘT / CẢM ỨNG VỚI CHÚ MÈO TRÊN SÂN KHẤU
         ======================================================================== */
      handleCatPointer(touching) {
        this.isPointerTouchingCat = touching;
        SoundEngine.sfxCondition(touching);

        if (this.currentStage === 1) {
          this.catColor = touching ? "purple" : "orange";
          if (touching) {
            this.s1.triedTouch = true;
          } else {
            if (this.s1.triedTouch) this.s1.triedLeave = true;
          }
          this.updateStage1Visuals();
          this.checkStage1Completion();
        } else if (this.currentStage === 2) {
          if (this.s2.isProgramRunning) {
            // Rẽ nhánh dạng thiếu: chạm thì đổi sang tím, rời ra vẫn giữ tím (vì không có nhánh nếu không thì)
            if (touching && this.s2.selectedControl === "if_then" && this.s2.conditionBlock === "touching_mouse" && this.s2.actionBlock === "set_purple") {
              this.catColor = "purple";
              this.s2.testedTouchAfterRun = true;
              this.completeStage(2, GAME_CONFIG.stages[2].successExplain);
            }
          } else {
            this.setMascot("encourage", "Em hãy lắp đủ khối lệnh rồi bấm nút '▶ CHẠY THỬ' trước khi chạm vào Mèo nhé!");
          }
          this.updateStageVisualHeaderOnly();
        } else if (this.currentStage === 3) {
          if (this.s3.isProgramRunning) {
            if (touching) {
              this.catColor = this.s3.thenBlock === "set_purple" ? "purple" : "orange";
              this.s3.testedTrueBranch = true;
            } else {
              this.catColor = this.s3.elseBlock === "clear_orange" ? "orange" : "purple";
              if (this.s3.testedTrueBranch) this.s3.testedFalseBranch = true;
            }
            this.updateStageVisualHeaderOnly();
            this.checkStage3Completion();
          } else {
            this.setMascot("encourage", "Em nhớ lắp cả 2 nhánh rồi bấm nút '▶ CHẠY THỬ' để kiểm tra chú Mèo nhé!");
            this.updateStageVisualHeaderOnly();
          }
        } else if (this.currentStage === 4) {
          if (this.s4.isProgramRunning) {
            const isFixedCorrectly = (this.s4.thenBlock === "set_purple" && this.s4.elseBlock === "clear_orange");
            if (touching) {
              this.catColor = this.s4.thenBlock === "set_purple" ? "purple" : "orange";
              if (isFixedCorrectly) this.s4.testedTrueAfterFix = true;
            } else {
              this.catColor = this.s4.elseBlock === "clear_orange" ? "orange" : "purple";
              if (isFixedCorrectly && this.s4.testedTrueAfterFix) this.s4.testedFalseAfterFix = true;
            }
            this.updateStageVisualHeaderOnly();
            if (!isFixedCorrectly) {
              this.setMascot("encourage", "Ồ! Mèo vẫn đổi màu bị ngược kìa! Em hãy bấm '🔄 Đổi chỗ 2 khối hành động' rồi bấm CHẠY THỬ lại nhé.");
            } else {
              this.checkStage4Completion();
            }
          } else {
            this.updateStageVisualHeaderOnly();
          }
        }
      },

      updateStageVisualHeaderOnly() {
        const stageBox = document.getElementById("scratchStageBox");
        const sensorBadge = document.getElementById("sensorStateBadge");
        const catBox = document.getElementById("catSvgContainer");
        const flowBox = document.getElementById("flowchartContainer");

        if (stageBox) {
          stageBox.className = "scratch-stage " + (this.isPointerTouchingCat ? "touching-active" : "");
        }
        if (sensorBadge) {
          sensorBadge.className = "sensor-pill " + (this.isPointerTouchingCat ? "true-state" : "false-state");
          sensorBadge.innerHTML = this.isPointerTouchingCat
            ? `🟢 &lt;đang chạm con trỏ chuột?&gt; : <strong>ĐÚNG</strong>`
            : `🟠 &lt;đang chạm con trỏ chuột?&gt; : <strong>SAI</strong>`;
        }
        if (catBox) {
          const speechText = this.catColor === "purple" ? "Hiệu ứng màu = 50 (Tím) ✨" : "Màu cam ban đầu 🐱";
          catBox.innerHTML = `
            <div class="cat-speech">${speechText}</div>
            ${SvgFactory.getCatSvg(this.catColor, this.isPointerTouchingCat)}
          `;
        }
        if (flowBox) {
          const mode = this.currentStage === 2 ? "missing" : "full";
          const rightLabel = this.currentStage === 2 ? "Giữ nguyên" : "Về màu Cam";
          flowBox.innerHTML = SvgFactory.getFlowchartSvg(this.isPointerTouchingCat, mode, rightLabel);
        }
      },

      /* ========================================================================
         RENDER BỐ CỤC CHUNG 4 MÀN CHƠI
         ======================================================================== */
      renderStage(stageNum) {
        const viewport = document.getElementById("mainViewport");
        const stConfig = GAME_CONFIG.stages[stageNum];
        const flowMode = stageNum === 2 ? "missing" : "full";

        viewport.innerHTML = `
          <div class="game-layout animate-pop">
            <!-- CỘT TRÁI: SÂN KHẤU MÈO + SƠ ĐỒ RẼ NHÁNH + TRỢ LÝ CHIBI -->
            <section class="panel-card" aria-label="Sân khấu mô phỏng Scratch">
              <div class="panel-header">
                <div class="panel-title">🎭 Sân khấu Chú Mèo Lập Trình</div>
                <span class="sim-badge">Giao diện mô phỏng phục vụ học tập</span>
              </div>

              <div class="scratch-stage ${this.isPointerTouchingCat ? 'touching-active' : ''}" id="scratchStageBox">
                <div class="stage-top-bar">
                  <div class="sensor-pill ${this.isPointerTouchingCat ? 'true-state' : 'false-state'}" id="sensorStateBadge">
                    ${this.isPointerTouchingCat
                      ? `🟢 &lt;đang chạm con trỏ chuột?&gt; : <strong>ĐÚNG</strong>`
                      : `🟠 &lt;đang chạm con trỏ chuột?&gt; : <strong>SAI</strong>`}
                  </div>
                </div>

                <!-- Vùng Chú Mèo SVG tương tác trực tiếp bằng chuột hoặc cảm ứng -->
                <div class="cat-hitbox" id="catSvgContainer"
                     onpointerenter="GameApp.handleCatPointer(true)"
                     onpointerleave="GameApp.handleCatPointer(false)"
                     onclick="GameApp.handleCatPointer(!GameApp.isPointerTouchingCat)"
                     title="Di chuột vào hoặc bấm vào Mèo để thử điều kiện">
                  <div class="cat-speech">${this.catColor === "purple" ? "Hiệu ứng màu = 50 (Tím) ✨" : "Màu cam ban đầu 🐱"}</div>
                  ${SvgFactory.getCatSvg(this.catColor, this.isPointerTouchingCat)}
                </div>

                <!-- Nút điều khiển tường minh hỗ trợ máy tính bảng / điện thoại -->
                <div class="stage-touch-controls">
                  <button class="btn-candy btn-primary" onclick="GameApp.handleCatPointer(true)" type="button">
                    👆 Đưa con trỏ CHẠM vào Mèo
                  </button>
                  <button class="btn-candy btn-orange" onclick="GameApp.handleCatPointer(false)" type="button">
                    👋 Đưa con trỏ RA NGOÀI Mèo
                  </button>
                </div>
              </div>

              <!-- Sơ đồ rẽ nhánh trực quan -->
              <div class="flowchart-box">
                <div class="flowchart-title">📐 SƠ ĐỒ CẤU TRÚC RẼ NHÁNH TRỰC QUAN</div>
                <div id="flowchartContainer">
                  ${SvgFactory.getFlowchartSvg(this.isPointerTouchingCat, flowMode, "Về màu Cam")}
                </div>
              </div>

              <!-- Linh vật Chibi phản hồi bằng bong bóng chữ -->
              <div class="mascot-bar" role="status" aria-live="polite">
                <div class="mascot-avatar" id="mascotAvatarBox">
                  ${SvgFactory.getMascotSvg(this.mascotState.mood)}
                </div>
                <div class="mascot-bubble" id="mascotBubbleBox">
                  ${this.mascotState.message}
                </div>
              </div>
            </section>

            <!-- CỘT PHẢI: NHIỆM VỤ & KHỐI LỆNH TƯƠNG TÁC -->
            <section class="panel-card" aria-label="Khu vực nhiệm vụ và lắp ghép lệnh">
              <div class="panel-header">
                <div class="panel-title">🧩 ${stConfig.name}</div>
                <span class="sim-badge">25 Điểm</span>
              </div>

              <div id="stageRightContent" style="display:flex; flex-direction:column; gap:14px; flex:1;"></div>

              <div class="stage-footer-bar">
                <button class="btn-candy" onclick="GameApp.resetCurrentStage()" type="button">
                  🔄 Làm lại màn này
                </button>
                <button class="btn-candy btn-mint" id="btnNextStage" onclick="GameApp.nextStage()" type="button" ${this.stageCompleted[stageNum] ? "" : "disabled"}>
                  ${stageNum < 4 ? "Màn tiếp theo ➔" : "🏆 Xem Tổng Kết ➔"}
                </button>
              </div>
            </section>
          </div>
        `;

        if (stageNum === 1) this.renderStage1Right();
        if (stageNum === 2) this.renderStage2Right();
        if (stageNum === 3) this.renderStage3Right();
        if (stageNum === 4) this.renderStage4Right();
      },

      /* ========================================================================
         MÀN 1: ĐIỀU KIỆN ĐÚNG HAY SAI?
         ======================================================================== */
      renderStage1Right() {
        const container = document.getElementById("stageRightContent");
        const q1 = GAME_CONFIG.stages[1].questions[0];
        const q2 = GAME_CONFIG.stages[1].questions[1];

        container.innerHTML = `
          <div style="background:#F5F2FF; border:2px solid #D9CFFF; border-radius:16px; padding:12px 14px; font-size:14.5px; font-weight:700;">
            📌 <strong>Nhiệm vụ 1:</strong> Em hãy đưa con trỏ chuột <strong>chạm vào Mèo</strong> rồi đưa <strong>ra ngoài Mèo</strong> ở sân khấu bên trái để bật sáng đủ 2 trạng thái điều kiện:
          </div>

          <div class="checklist-grid">
            <div class="check-item ${this.s1.triedTouch ? 'done' : ''}" id="chkTouch1">
              <span>${this.s1.triedTouch ? '✅' : '⬜'}</span>
              <span>1. Thử chạm vào Mèo (ĐÚNG → Tím)</span>
            </div>
            <div class="check-item ${this.s1.triedLeave ? 'done' : ''}" id="chkLeave1">
              <span>${this.s1.triedLeave ? '✅' : '⬜'}</span>
              <span>2. Thử rời khỏi Mèo (SAI → Cam)</span>
            </div>
          </div>

          <div style="background:#F5F2FF; border:2px solid #D9CFFF; border-radius:16px; padding:12px 14px; font-size:14.5px; font-weight:700;">
            📌 <strong>Nhiệm vụ 2:</strong> Sau khi quan sát chú Mèo, em hãy trả lời 2 câu hỏi dưới đây:
          </div>

          <div class="quiz-card">
            <div style="font-weight:800; font-size:15px;">${q1.text}</div>
            <div class="quiz-options">
              ${q1.options.map(opt => `
                <button class="option-btn ${this.s1.q1Answered && opt.correct ? 'correct' : ''}"
                        onclick="GameApp.answerStage1Quiz(0, '${opt.id}', this)" type="button">
                  ${opt.text}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="quiz-card">
            <div style="font-weight:800; font-size:15px;">${q2.text}</div>
            <div class="quiz-options">
              ${q2.options.map(opt => `
                <button class="option-btn ${this.s1.q2Answered && opt.correct ? 'correct' : ''}"
                        onclick="GameApp.answerStage1Quiz(1, '${opt.id}', this)" type="button">
                  ${opt.text}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      },

      updateStage1Visuals() {
        this.updateStageVisualHeaderOnly();
        const chk1 = document.getElementById("chkTouch1");
        const chk2 = document.getElementById("chkLeave1");
        if (chk1) {
          chk1.className = "check-item " + (this.s1.triedTouch ? "done" : "");
          chk1.innerHTML = `<span>${this.s1.triedTouch ? "✅" : "⬜"}</span><span>1. Thử chạm vào Mèo (ĐÚNG → Tím)</span>`;
        }
        if (chk2) {
          chk2.className = "check-item " + (this.s1.triedLeave ? "done" : "");
          chk2.innerHTML = `<span>${this.s1.triedLeave ? "✅" : "⬜"}</span><span>2. Thử rời khỏi Mèo (SAI → Cam)</span>`;
        }
      },

      answerStage1Quiz(qIndex, optId, btnEl) {
        const qObj = GAME_CONFIG.stages[1].questions[qIndex];
        const chosen = qObj.options.find(o => o.id === optId);
        if (!chosen) return;

        if (chosen.correct) {
          SoundEngine.sfxCorrect();
          btnEl.classList.remove("wrong");
          btnEl.classList.add("correct");
          if (qIndex === 0) this.s1.q1Answered = true;
          if (qIndex === 1) this.s1.q2Answered = true;
          this.setMascot("celebrate", qObj.explainRight);
          this.checkStage1Completion();
        } else {
          SoundEngine.sfxWrong();
          btnEl.classList.add("wrong");
          setTimeout(() => btnEl.classList.remove("wrong"), 500);
          this.setMascot("encourage", qObj.explainWrong);
        }
      },

      checkStage1Completion() {
        if (this.s1.triedTouch && this.s1.triedLeave && this.s1.q1Answered && this.s1.q2Answered) {
          this.completeStage(1, "Hoàn thành Màn 1! Em đã nắm vững điều kiện ĐÚNG/SAI và khái niệm cấu trúc rẽ nhánh.");
        } else if (this.s1.q1Answered && this.s1.q2Answered && (!this.s1.triedTouch || !this.s1.triedLeave)) {
          this.setMascot("encourage", "Em đã trả lời đúng 2 câu hỏi! Giờ hãy thử chạm và đưa con trỏ ra ngoài chú Mèo ở sân khấu bên trái để hoàn thành màn 1 nhé!");
        }
      },

      selectStage2Control(ctrlId) {
        this.s2.isProgramRunning = false;
        if (ctrlId === "if_then") {
          SoundEngine.sfxSnap();
          this.s2.selectedControl = "if_then";
          this.setMascot("celebrate", "Đúng rồi! Khối 'nếu <...> thì ...' dùng để biểu diễn cấu trúc rẽ nhánh dạng thiếu.");
        } else {
          SoundEngine.sfxWrong();
          this.s2.selectedControl = ctrlId;
          this.setMascot("encourage", "Khối này không phải cấu trúc rẽ nhánh! Để kiểm tra điều kiện 'nếu chạm chuột thì đổi màu', em hãy chọn khối 'nếu <...> thì ...' nhé.");
        }
        this.renderStage2Right();
      },

      pickStage2Block(itemId) {
        SoundEngine.sfxClick();
        this.s2.selectedPaletteItem = itemId;
        if (itemId === "touching_mouse" || itemId === "key_space") {
          this.s2.conditionBlock = itemId;
          this.s2.selectedPaletteItem = null;
          SoundEngine.sfxSnap();
        } else if (itemId === "set_purple" || itemId === "say_hello") {
          this.s2.actionBlock = itemId;
          this.s2.selectedPaletteItem = null;
          SoundEngine.sfxSnap();
        }
        this.s2.isProgramRunning = false;
        this.renderStage2Right();
      },

      onDragStart(ev, itemId) {
        ev.dataTransfer.setData("text/plain", itemId);
      },

      onDropStage2(ev, targetSlot) {
        ev.preventDefault();
        const itemId = ev.dataTransfer.getData("text/plain");
        this.applyStage2Slot(targetSlot, itemId);
      },

      slotClickStage2(targetSlot) {
        if (!this.s2.selectedPaletteItem) return;
        this.applyStage2Slot(targetSlot, this.s2.selectedPaletteItem);
      },

      applyStage2Slot(targetSlot, itemId) {
        if (targetSlot === "condition" && (itemId === "touching_mouse" || itemId === "key_space")) {
          this.s2.conditionBlock = itemId;
          SoundEngine.sfxSnap();
        } else if (targetSlot === "action" && (itemId === "set_purple" || itemId === "say_hello")) {
          this.s2.actionBlock = itemId;
          SoundEngine.sfxSnap();
        } else {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Khe lục giác chỉ gắn được khối Điều kiện màu xanh, còn khe bên trong gắn khối Hiển thị màu tím nhé!");
        }
        this.s2.selectedPaletteItem = null;
        this.s2.isProgramRunning = false;
        this.renderStage2Right();
      },

      runStage2Program() {
        if (this.s2.selectedControl !== "if_then") {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Ở Bước 1, em hãy chọn đúng khung 'nếu <...> thì ...' trước khi chạy thử nhé!");
          return;
        }
        if (this.s2.conditionBlock !== "touching_mouse") {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Điều kiện chưa đúng! Đề bài yêu cầu kiểm tra 'đang chạm con trỏ chuột?'. Em hãy gắn lại khối màu xanh nhé.");
          return;
        }
        if (this.s2.actionBlock !== "set_purple") {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Khối hành động chưa đúng! Em cần gắn khối 'đặt hiệu ứng màu bằng 50 (Đổi màu tím)' vào trong khung.");
          return;
        }

        SoundEngine.sfxCorrect();
        this.s2.isProgramRunning = true;
        this.setMascot("celebrate", "Chương trình đã sẵn sàng! Bây giờ em hãy di chuột chạm vào Mèo (hoặc bấm nút 'Đưa con trỏ CHẠM vào Mèo') để xem kết quả nhé!");
        this.renderStage2Right();
      },

      /* ========================================================================
         MÀN 3: RẼ NHÁNH DẠNG ĐỦ
         ======================================================================== */
      renderStage3Right() {
        const container = document.getElementById("stageRightContent");
        const s3 = this.s3;

        const renderActionSlot = (val) => {
          if (val === "set_purple") {
            return `<span class="puzzle-piece piece-looks" style="padding:6px 12px; min-height:34px; font-size:13px;">🟪 đặt hiệu ứng màu bằng 50 (Đổi màu tím)</span>`;
          }
          if (val === "clear_orange") {
            return `<span class="puzzle-piece piece-looks" style="padding:6px 12px; min-height:34px; font-size:13px;">🟪 bỏ các hiệu ứng đồ họa (Về màu cam)</span>`;
          }
          return `Bấm vào đây để gắn khối hành động`;
        };

        container.innerHTML = `
          <div style="background:#FFF6EB; border:2px solid #FFD3A3; border-radius:16px; padding:10px 14px; font-size:14px; font-weight:700;">
            🎯 <strong>Yêu cầu:</strong> Lắp cấu trúc rẽ nhánh dạng đủ: <em>"Nếu đang chạm con trỏ chuột thì đổi sang màu tím, nếu không thì bỏ hiệu ứng đồ họa (về màu cam)"</em>.
          </div>

          <div>

            </div>
            <div class="block-palette">
              <div class="puzzle-piece piece-sensing ${s3.selectedPaletteItem === 'touching_mouse' ? 'selected-piece' : ''}"
                   draggable="true"
                   ondragstart="GameApp.onDragStart(event, 'touching_mouse')"
                   onclick="GameApp.selectStage3Palette('touching_mouse')">
                🔹 đang chạm con trỏ chuột?
              </div>
              <div class="puzzle-piece piece-looks ${s3.selectedPaletteItem === 'set_purple' ? 'selected-piece' : ''}"
                   draggable="true"
                   ondragstart="GameApp.onDragStart(event, 'set_purple')"
                   onclick="GameApp.selectStage3Palette('set_purple')">
                🟪 đặt hiệu ứng màu bằng 50 (Đổi màu tím)
              </div>
              <div class="puzzle-piece piece-looks ${s3.selectedPaletteItem === 'clear_orange' ? 'selected-piece' : ''}"
                   draggable="true"
                   ondragstart="GameApp.onDragStart(event, 'clear_orange')"
                   onclick="GameApp.selectStage3Palette('clear_orange')">
                🟪 bỏ các hiệu ứng đồ họa (Về màu cam)
              </div>
            </div>
          </div>

          <!-- Khối Nếu ... thì ... nếu không thì ... -->
          <div class="scratch-c-block">
            <div class="c-row">
              <span>nếu</span>
              <div class="hex-slot ${s3.selectedPaletteItem === 'touching_mouse' ? 'highlight-slot' : ''}"
                   ondragover="event.preventDefault()"
                   ondrop="GameApp.onDropStage3(event, 'cond')"
                   onclick="GameApp.slotClickStage3('cond')">
                ${s3.conditionBlock === "touching_mouse"
                  ? `<span class="puzzle-piece piece-sensing" style="padding:4px 14px; min-height:32px; font-size:13px;">đang chạm con trỏ chuột?</span>`
                  : `Gắn &lt;Điều kiện&gt;`}
              </div>
              <span>thì (Nhánh ĐÚNG)</span>
            </div>

            <div class="mouth-slot ${s3.selectedPaletteItem && s3.selectedPaletteItem !== 'touching_mouse' ? 'highlight-slot' : ''}"
                 ondragover="event.preventDefault()"
                 ondrop="GameApp.onDropStage3(event, 'then')"
                 onclick="GameApp.slotClickStage3('then')">
              ${renderActionSlot(s3.thenBlock)}
            </div>

            <div class="c-row">
              <span>nếu không thì (Nhánh SAI)</span>
            </div>

            <div class="mouth-slot ${s3.selectedPaletteItem && s3.selectedPaletteItem !== 'touching_mouse' ? 'highlight-slot' : ''}"
                 ondragover="event.preventDefault()"
                 ondrop="GameApp.onDropStage3(event, 'else')"
                 onclick="GameApp.slotClickStage3('else')">
              ${renderActionSlot(s3.elseBlock)}
            </div>
          </div>

          <!-- Nút chạy thử + Checklist kiểm chứng 2 nhánh -->
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">

              ▶ CHẠY THỬ HAI NHÁNH
            </button>
            <div style="display:flex; gap:8px; font-size:13px; font-weight:800;">
              <span style="padding:5px 10px; border-radius:999px; background:${s3.testedTrueBranch ? '#E8FBF5' : '#F1F5F9'}; color:${s3.testedTrueBranch ? '#0D704E' : '#64748B'};">
                ${s3.testedTrueBranch ? "✅ Nhánh ĐÚNG (Chạm)" : "⬜ Nhánh ĐÚNG (Chạm)"}
              </span>
              <span style="padding:5px 10px; border-radius:999px; background:${s3.testedFalseBranch ? '#E8FBF5' : '#F1F5F9'}; color:${s3.testedFalseBranch ? '#0D704E' : '#64748B'};">
                ${s3.testedFalseBranch ? "✅ Nhánh SAI (Rời ra)" : "⬜ Nhánh SAI (Rời ra)"}
              </span>
            </div>
          </div>
        `;
      },

      selectStage3Palette(itemId) {
        SoundEngine.sfxClick();
        if (itemId === "touching_mouse") {
          this.s3.conditionBlock = "touching_mouse";
          this.s3.selectedPaletteItem = null;
          SoundEngine.sfxSnap();
        } else {
          this.s3.selectedPaletteItem = itemId;
          // Hỗ trợ tự động điền vào khe trống đầu tiên nếu học sinh bấm trực tiếp
          if (!this.s3.thenBlock) {
            this.s3.thenBlock = itemId;
            this.s3.selectedPaletteItem = null;
            SoundEngine.sfxSnap();
          } else if (!this.s3.elseBlock) {
            this.s3.elseBlock = itemId;
            this.s3.selectedPaletteItem = null;
            SoundEngine.sfxSnap();
          }
        }
        this.s3.isProgramRunning = false;
        this.renderStage3Right();
      },

      onDropStage3(ev, slotName) {
        ev.preventDefault();
        const itemId = ev.dataTransfer.getData("text/plain");
        this.applyStage3Slot(slotName, itemId);
      },

      slotClickStage3(slotName) {
        if (!this.s3.selectedPaletteItem) {
          // Cho phép bấm vào khe đã có lệnh để gỡ ra
          if (slotName === "then" && this.s3.thenBlock) {
            this.s3.thenBlock = null;
            SoundEngine.sfxClick();
            this.renderStage3Right();
          } else if (slotName === "else" && this.s3.elseBlock) {
            this.s3.elseBlock = null;
            SoundEngine.sfxClick();
            this.renderStage3Right();
          }
          return;
        }
        this.applyStage3Slot(slotName, this.s3.selectedPaletteItem);
      },

      applyStage3Slot(slotName, itemId) {
        if (slotName === "cond" && itemId === "touching_mouse") {
          this.s3.conditionBlock = "touching_mouse";
          SoundEngine.sfxSnap();
        } else if (slotName === "then" && itemId !== "touching_mouse") {
          this.s3.thenBlock = itemId;
          SoundEngine.sfxSnap();
        } else if (slotName === "else" && itemId !== "touching_mouse") {
          this.s3.elseBlock = itemId;
          SoundEngine.sfxSnap();
        } else {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Khe điều kiện lục giác chỉ nhận khối màu xanh, khe hành động chỉ nhận khối màu tím nhé!");
        }
        this.s3.selectedPaletteItem = null;
        this.s3.isProgramRunning = false;
        this.renderStage3Right();
      },

      runStage3Program() {
        if (this.s3.conditionBlock !== "touching_mouse") {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Em chưa gắn khối điều kiện <đang chạm con trỏ chuột?> vào khe lục giác!");
          return;
        }
        if (this.s3.thenBlock !== "set_purple" || this.s3.elseBlock !== "clear_orange") {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Chưa đúng nhánh rồi! Nhánh 'thì' cần gắn 'Đổi màu tím', còn nhánh 'nếu không thì' cần gắn 'Về màu cam' nhé!");
          return;
        }
        SoundEngine.sfxCorrect();
        this.s3.isProgramRunning = true;
        this.setMascot("celebrate", "Khối lệnh đã chuẩn! Bây giờ em hãy thử lần lượt: (1) Chạm vào Mèo và (2) Đưa con trỏ ra ngoài Mèo để kiểm tra cả 2 nhánh!");
        this.renderStage3Right();
      },

      checkStage3Completion() {
        this.renderStage3Right();
        if (this.s3.testedTrueBranch && this.s3.testedFalseBranch) {
          this.completeStage(3, GAME_CONFIG.stages[3].successExplain);
        } else if (this.s3.testedTrueBranch && !this.s3.testedFalseBranch) {
          this.setMascot("celebrate", "Nhánh ĐÚNG đã hoạt động! Giờ em hãy đưa con trỏ RA NGOÀI Mèo để kiểm tra nốt nhánh SAI nhé!");
        }
      },

      /* ========================================================================
         MÀN 4: THỢ SỬA LỆNH TÀI BA
         ======================================================================== */
      renderStage4Right() {
        const container = document.getElementById("stageRightContent");
        const s4 = this.s4;
        const isFixed = (s4.thenBlock === "set_purple" && s4.elseBlock === "clear_orange");

        const renderBlock = (type) => {
          if (type === "set_purple") {
            return `<span class="puzzle-piece piece-looks" style="padding:6px 12px; min-height:36px; font-size:13px;">🟪 đặt hiệu ứng màu bằng 50 (Đổi sang màu Tím)</span>`;
          }
          return `<span class="puzzle-piece piece-looks" style="padding:6px 12px; min-height:36px; font-size:13px;">🟪 bỏ các hiệu ứng đồ họa (Về màu Cam ban đầu)</span>`;
        };

        container.innerHTML = `
          <div style="background:${isFixed ? '#E8FBF5' : '#FFF0F3'}; border:2px solid ${isFixed ? '#2EC492' : '#FF8FA3'}; border-radius:16px; padding:10px 14px; font-size:14px; font-weight:700;">
            ${isFixed
              ? `✅ <strong>Đã đổi chỗ đúng!</strong> Nhánh ĐÚNG đổi sang màu Tím, nhánh SAI về màu Cam. Hãy bấm <strong>CHẠY THỬ</strong> và kiểm tra cả 2 trạng thái trên Mèo!`
              : `⚠️ <strong>Phát hiện lỗi:</strong> Hai khối lệnh hành động đang bị đặt NGƯỢC nhánh! Em hãy bấm vào khe lệnh hoặc nút <strong>"Đổi chỗ 2 khối hành động"</strong> để sửa lại nhé.`}
          </div>

          <div class="scratch-c-block">
            <div class="c-row">
              <span>nếu</span>
              <div class="hex-slot">
                <span class="puzzle-piece piece-sensing" style="padding:4px 14px; min-height:32px; font-size:13px;">đang chạm con trỏ chuột?</span>
              </div>
              <span>thì (Khi ĐÚNG)</span>
            </div>

            <div class="mouth-slot" onclick="GameApp.swapStage4Blocks()" title="Bấm để đổi chỗ 2 khối hành động">
              ${renderBlock(s4.thenBlock)}
              <span style="font-size:12px; font-weight:800; color:#6846D6;">⇅ Đổi chỗ</span>
            </div>

            <div class="c-row">
              <span>nếu không thì (Khi SAI)</span>
            </div>

            <div class="mouth-slot" onclick="GameApp.swapStage4Blocks()" title="Bấm để đổi chỗ 2 khối hành động">
              ${renderBlock(s4.elseBlock)}
              <span style="font-size:12px; font-weight:800; color:#6846D6;">⇅ Đổi chỗ</span>
            </div>
          </div>

          <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
            <button class="btn-candy btn-primary" onclick="GameApp.swapStage4Blocks()" type="button">
              🔄 Đổi chỗ 2 khối hành động
            </button>
            <button class="btn-candy btn-orange" onclick="GameApp.runStage4Program()" type="button">
              ▶ CHẠY THỬ SAU KHI SỬA
            </button>
          </div>

          <div class="checklist-grid">
            <div class="check-item ${s4.testedTrueAfterFix ? 'done' : ''}">
              <span>${s4.testedTrueAfterFix ? '✅' : '⬜'}</span>
              <span>1. Chạm vào Mèo → Đổi màu Tím</span>
            </div>
            <div class="check-item ${s4.testedFalseAfterFix ? 'done' : ''}">
              <span>${s4.testedFalseAfterFix ? '✅' : '⬜'}</span>
              <span>2. Rời khỏi Mèo → Trở về màu Cam</span>
            </div>
          </div>
        `;
      },

      swapStage4Blocks() {
        SoundEngine.sfxSnap();
        const temp = this.s4.thenBlock;
        this.s4.thenBlock = this.s4.elseBlock;
        this.s4.elseBlock = temp;
        this.s4.isProgramRunning = false;
        this.s4.testedTrueAfterFix = false;
        this.s4.testedFalseAfterFix = false;

        if (this.s4.thenBlock === "set_purple") {
          this.setMascot("celebrate", "Tuyệt quá! Em đã đặt đúng nhánh rồi. Bây giờ hãy bấm '▶ CHẠY THỬ SAU KHI SỬA' và thử chạm/rời chuột khỏi Mèo nhé!");
        } else {
          this.setMascot("encourage", "Ôi, 2 khối hành động lại bị ngược rồi! Hãy đổi chỗ lại sao cho nhánh 'thì' là Đổi sang màu Tím nhé.");
        }
        this.renderStage4Right();
      },

      runStage4Program() {
        this.s4.isProgramRunning = true;
        if (this.s4.thenBlock === "set_purple" && this.s4.elseBlock === "clear_orange") {
          SoundEngine.sfxCorrect();
          this.setMascot("celebrate", "Chương trình đã chạy! Em hãy thử (1) Chạm con trỏ vào Mèo và (2) Đưa con trỏ ra ngoài Mèo để nghiệm thu nhé!");
        } else {
          SoundEngine.sfxWrong();
          this.setMascot("encourage", "Chương trình đang chạy với 2 lệnh bị ngược! Hãy thử chạm vào Mèo mà xem, hoặc bấm 'Đổi chỗ 2 khối hành động' để sửa lỗi nhé!");
        }
        this.renderStage4Right();
      },

      checkStage4Completion() {
        this.renderStage4Right();
        if (this.s4.testedTrueAfterFix && this.s4.testedFalseAfterFix) {
          this.completeStage(4, GAME_CONFIG.stages[4].successExplain);
        } else if (this.s4.testedTrueAfterFix && !this.s4.testedFalseAfterFix) {
          this.setMascot("celebrate", "Khi chạm vào, Mèo đã hóa Tím đúng rồi! Giờ em hãy đưa con trỏ RA NGOÀI Mèo để kiểm tra Mèo trở về màu Cam nhé!");
        }
      },

      /* ========================================================================
         MÀN TỔNG KẾT & HUY HIỆU
         ======================================================================== */
      renderSummary() {
        const viewport = document.getElementById("mainViewport");
        const total = this.getTotalScore();

        viewport.innerHTML = `
          <section class="summary-card animate-pop">
            <div style="display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap;">
              ${SvgFactory.getCatSvg("purple", true)}
              <div>
                <div class="welcome-tag">🏆 HOÀN THÀNH XUẤT SẮC BÀI 13</div>
                <h1 style="font-size:34px; font-weight:900; color:#5135B8;">HIỆP SĨ NGÃ RẼ THÔNG MINH</h1>
                <p style="font-size:20px; font-weight:800; color:#D46B08; margin-top:4px;">
                  ⭐ Tổng điểm đạt được: ${total} / 100 điểm
                </p>
              </div>
              ${SvgFactory.getMascotSvg("celebrate")}
            </div>

            <div class="summary-grid">
              <div class="knowledge-box">
                <h3 style="color:#5135B8; font-size:17px; margin-bottom:8px;">1. Cấu trúc rẽ nhánh dạng thiếu</h3>
                <p style="font-size:14.5px; margin-bottom:8px;">
                  <strong>Nếu</strong> &lt;điều kiện&gt; <strong>thì</strong> &lt;công việc&gt;.
                </p>
                <p style="font-size:14px; color:var(--text-muted);">
                  • Khi điều kiện ĐÚNG: thực hiện công việc.<br/>
                  • Khối lệnh Scratch: <code>nếu &lt;...&gt; thì ...</code>
                </p>
              </div>

              <div class="knowledge-box">
                <h3 style="color:#5135B8; font-size:17px; margin-bottom:8px;">2. Cấu trúc rẽ nhánh dạng đủ</h3>
                <p style="font-size:14.5px; margin-bottom:8px;">
                  <strong>Nếu</strong> &lt;điều kiện&gt; <strong>thì</strong> &lt;công việc 1&gt;, <strong>nếu không thì</strong> &lt;công việc 2&gt;.
                </p>
                <p style="font-size:14px; color:var(--text-muted);">
                  • Khi điều kiện ĐÚNG: thực hiện công việc 1.<br/>
                  • Khi điều kiện SAI: thực hiện công việc 2.<br/>
                  • Khối lệnh Scratch: <code>nếu &lt;...&gt; thì ... nếu không thì ...</code>
                </p>
              </div>
            </div>

            <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
              <button class="btn-candy btn-primary" style="font-size:17px; padding:12px 26px;" onclick="GameApp.replayAll()" type="button">
                🔄 Chơi lại từ đầu
              </button>
              <button class="btn-candy btn-orange" style="font-size:16px; padding:12px 22px;" onclick="GameApp.jumpToStage(1)" type="button">
                🔍 Xem lại các màn chơi
              </button>
            </div>
          </section>
        `;
      },

      replayAll() {
        SoundEngine.sfxClick();
        this.stageCompleted = { 1: false, 2: false, 3: false, 4: false };
        this.loadStage(1);
      },

      /* ========================================================================
         MODAL HƯỚNG DẪN & GỢI Ý
         ======================================================================== */
      showGuideModal() {
        SoundEngine.sfxClick();
        document.getElementById("modalTitle").textContent = "📖 Hướng dẫn cách chơi";
        document.getElementById("modalBody").innerHTML = `
          <p><strong>1. Sân khấu Chú Mèo Lập Trình (Bên trái):</strong> Em có thể di chuột trực tiếp vào chú Mèo hoặc bấm 2 nút <em>"Đưa con trỏ CHẠM vào Mèo"</em> / <em>"Đưa con trỏ RA NGOÀI Mèo"</em> để kiểm tra điều kiện ĐÚNG/SAI.</p>
          <p><strong>2. Lắp ghép khối lệnh Scratch (Bên phải):</strong> Hỗ trợ cả 2 cách: <strong>Kéo – Thả</strong> khối lệnh vào khe trống HOẶC <strong>Chạm chọn khối lệnh</strong> rồi chạm vào khe cần lắp.</p>
          <p><strong>3. Tính điểm:</strong> Trò chơi gồm 4 màn, mỗi màn hoàn thành đạt <strong>25 điểm</strong> (Tổng 100 điểm). Khi gặp khó khăn, em hãy bấm nút <strong>💡 Gợi ý</strong> trên thanh công cụ nhé!</p>
        `;
        document.getElementById("modalBackdrop").classList.add("open");
      },

      showHint() {
        SoundEngine.sfxClick();
        if (!this.currentScreen.startsWith("stage")) {
          this.showGuideModal();
          return;
        }
        const st = GAME_CONFIG.stages[this.currentStage];
        this.setMascot("encourage", st.hint);
        document.getElementById("modalTitle").textContent = `💡 Gợi ý ${st.name}`;
        document.getElementById("modalBody").innerHTML = `<p>${st.hint}</p>`;
        document.getElementById("modalBackdrop").classList.add("open");
      },

      closeModal() {
        SoundEngine.sfxClick();
        document.getElementById("modalBackdrop").classList.remove("open");
      }
    };

    window.onload = function () {
      GameApp.init();
    };
  </script>
</body>
</html>
