<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẢO KHO BÁU INTERNET - Tin học 3</title>
    <style>
        :root {
            --bg: #FFF8E9; --green: #53B77A; --yellow: #FFC65C; --red: #EF7469; --purple: #7766B7; --text: #333; --white: #FFF;
            --blue: #4BA3E3;
        }
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; user-select: none; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-app { width: 100%; max-width: 1024px; height: 100vh; max-height: 768px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; overflow: hidden; border: 4px solid var(--green); }
        
        /* HEADER & UI */
        .header { padding: 15px 20px; background: var(--green); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls button { padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .controls button:active { transform: translateY(2px); box-shadow: none; }
        .btn-bgm { background: var(--yellow); color: var(--text); }
        .btn-sfx { background: var(--purple); color: white; }
        .btn-off { opacity: 0.5; }

        /* SCREENS */
        .screen { flex: 1; padding: 20px; display: none; flex-direction: column; align-items: center; position: relative; overflow-y: auto; background-image: radial-gradient(circle at top left, rgba(83, 183, 122, 0.1), transparent 50%), radial-gradient(circle at bottom right, rgba(119, 102, 183, 0.1), transparent 50%); }
        .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* MASCOT BÍP */
        #mascot-container { position: absolute; bottom: 20px; left: 20px; display: flex; align-items: flex-end; z-index: 10; pointer-events: none; }
        .bubble { background: white; border: 3px solid var(--green); border-radius: 20px; padding: 12px 18px; margin-left: 10px; margin-bottom: 40px; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-weight: bold; color: var(--text); display: none; font-size: 16px; line-height: 1.4; position: relative; }
        .bubble::before { content: ''; position: absolute; bottom: -10px; left: -10px; border-width: 10px 10px 0 0; border-style: solid; border-color: var(--green) transparent transparent transparent; }
        svg.robot { width: 110px; height: 130px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }

        /* LEVEL STYLES */
        .level-title { color: var(--purple); font-size: 28px; margin-bottom: 5px; text-transform: uppercase; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .level-desc { color: var(--text); font-size: 18px; margin-bottom: 20px; text-align: center; max-width: 800px; font-weight: 500; background: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 15px; }
        
        /* Buttons */
        .action-bar { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        .btn-action { padding: 12px 30px; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; background: var(--purple); box-shadow: 0 5px 0 rgba(119, 102, 183, 0.4); transition: 0.2s; outline: none; }
        .btn-action:active { transform: translateY(5px); box-shadow: 0 0px 0 rgba(119, 102, 183, 0.4); }
        .btn-action:disabled { background: #ccc; box-shadow: 0 5px 0 #999; cursor: not-allowed; transform: none; }
        .btn-hint { background: var(--yellow); color: var(--text); box-shadow: 0 5px 0 rgba(255, 198, 92, 0.5); }
        .btn-check { background: var(--green); box-shadow: 0 5px 0 rgba(83, 183, 122, 0.5); }
        .btn-next { background: var(--blue); box-shadow: 0 5px 0 rgba(75, 163, 227, 0.5); display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Màn 1 Grid */
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 600px; }
        .card { background: white; border: 4px solid #E0E0E0; border-radius: 20px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.2s; font-size: 20px; font-weight: bold; color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); border-color: var(--blue); }
        .card.selected { border-color: var(--green); background: #E8F5E9; box-shadow: 0 8px 15px rgba(83,183,122,0.2); }
        
        /* Màn 2 Grid */
        .grid-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 700px; }
        .card-sm { background: white; border: 3px solid #E0E0E0; border-radius: 15px; padding: 20px 10px; text-align: center; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; }
        .card-sm:hover { background: #f0f8ff; border-color: var(--blue); }

        /* Màn 3 Rows */
        .scenario-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        .row-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 15px; border-left: 8px solid var(--purple); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .row-text { font-size: 18px; font-weight: bold; flex: 1; }
        .row-actions { display: flex; gap: 10px; }
        .row-actions button { padding: 10px 15px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .row-actions button:active { transform: scale(0.95); }
        .btn-opt { background: #f0f0f0; color: #555; }
        .btn-opt.selected.open { background: var(--green); color: white; border-color: #3d8b5b; }
        .btn-opt.selected.close { background: var(--red); color: white; border-color: #c95b52; }
        .btn-opt.selected.ask { background: var(--yellow); color: var(--text); border-color: #d19e40; }

        /* Màn 4 Drag/Drop (Click to Move) */
        .dnd-container { display: flex; width: 100%; max-width: 800px; gap: 20px; justify-content: space-around; margin-top: 20px; }
        .bin { flex: 1; min-height: 250px; border: 4px dashed #ccc; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; background: rgba(255,255,255,0.6); transition: 0.3s; }
        .bin-title { font-size: 20px; font-weight: bold; padding-bottom: 10px; border-bottom: 2px solid #ccc; width: 100%; text-align: center; }
        .bin.nen-lam { border-color: var(--green); }
        .bin.nen-lam .bin-title { color: var(--green); border-bottom-color: var(--green); }
        .bin.tranh-lam { border-color: var(--red); }
        .bin.tranh-lam .bin-title { color: var(--red); border-bottom-color: var(--red); }
        
        .item-source { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; min-height: 100px; width: 100%; max-width: 800px; padding: 15px; background: rgba(255,255,255,0.5); border-radius: 15px; border: 2px dashed #bbb; }
        .dnd-item { padding: 12px 20px; background: white; border: 3px solid var(--purple); border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 rgba(119,102,183,0.3); transition: 0.2s; text-align: center; }
        .dnd-item:active { transform: translateY(4px); box-shadow: none; }
        .dnd-item.active { background: var(--purple); color: white; transform: scale(1.05) translateY(-5px); box-shadow: 0 8px 15px rgba(119,102,183,0.4); }

        /* Helpers & States */
        .correct-bg { background: #E8F5E9 !important; border-color: var(--green) !important; }
        .wrong-bg { background: #FFEBEE !important; border-color: var(--red) !important; }
        
        /* Result Screen */
        .trophy-svg { width: 150px; height: 150px; margin-bottom: 20px; animation: bounceIn 1s; }
        @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .final-score { font-size: 48px; color: var(--green); font-weight: bold; margin: 10px 0; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }

    </style>
</head>
<body>
    <div id="game-app">
        <div class="header">
            <div class="info">🏝️ ĐẢO KHO BÁU INTERNET | Cấp độ: <span id="progress">0/4</span> | Điểm: <span id="score">0</span></div>
            <div class="controls">
                <button id="btn-bgm" class="btn-bgm">🎵 Nhạc: BẬT</button>
                <button id="btn-sfx" class="btn-sfx">🔊 Hiệu Ứng: BẬT</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHÀO MỪNG -->
        <div id="screen-welcome" class="screen active" style="justify-content: center;">
            <h1 style="color:var(--green); font-size:42px; text-shadow: 2px 2px 0 rgba(0,0,0,0.1); text-align: center; margin-top:0;">ĐẢO KHO BÁU INTERNET</h1>
            <svg viewBox="0 0 300 200" width="300" height="200" style="filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15)); margin-bottom: 20px;">
                <rect x="30" y="30" width="240" height="140" fill="#FFE0B2" rx="15"/>
                <path d="M50 50 Q150 -10 250 50 T250 150 Q150 210 50 150 Z" fill="#C8E6C9"/>
                <circle cx="210" cy="110" r="12" fill="#EF7469"/>
                <path d="M70 120 L110 90 L160 130 L200 110" stroke="#795548" stroke-width="4" stroke-dasharray="6,6" fill="none"/>
                <text x="200" y="100" font-size="24" fill="#EF7469" font-weight="bold">X</text>
            </svg>
            <p class="level-desc" style="font-size: 22px;">Cùng Bíp thám hiểm để tìm hiểu cách khám phá thông tin trên Internet an toàn và bổ ích nhé!</p>
            <div class="action-bar">
                <button class="btn-action btn-check" style="font-size: 24px; padding: 15px 40px;" onclick="startGame()">▶ BẮT ĐẦU</button>
            </div>
        </div>

        <!-- CONTAINER CÁC MÀN CHƠI -->
        <div id="game-screens" style="flex:1; display:flex; flex-direction:column; overflow: hidden; width: 100%;"></div>

        <!-- MASCOT -->
        <div id="mascot-container">
            <svg class="robot" viewBox="0 0 100 120" id="bip-svg">
                <!-- Thân -->
                <rect x="25" y="40" width="50" height="60" rx="15" fill="#53B77A"/>
                <!-- Đầu -->
                <rect x="15" y="10" width="70" height="45" rx="15" fill="#E8F5E9" stroke="#53B77A" stroke-width="3"/>
                <!-- Anten -->
                <line x1="50" y1="10" x2="50" y2="0" stroke="#EF7469" stroke-width="4"/>
                <circle cx="50" cy="0" r="5" fill="#FFC65C"/>
                <!-- Mắt -->
                <circle id="bip-eye-l" cx="35" cy="30" r="6" fill="#333"/>
                <circle id="bip-eye-r" cx="65" cy="30" r="6" fill="#333"/>
                <!-- Miệng -->
                <path id="bip-mouth" d="M 40 42 Q 50 48 60 42" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="bubble" id="bip-bubble">Chào bạn! Nhấn Bắt đầu để chơi nhé!</div>
        </div>
    </div>

    <script>
        const GAME_CONFIG = {
            title: "ĐẢO KHO BÁU INTERNET",
            levels: [
                {
                    id: 1, type: "multi-select",
                    title: "Màn 1: Bản Đồ Thông Tin",
                    desc: "Trên Internet có rất nhiều thông tin. Hãy chọn 3 thẻ thông tin mà em CÓ THỂ tìm thấy để mở khóa bản đồ nhé!",
                    hint: "Trên Internet có các bài học, tin tức thế giới và nội dung giải trí (phim, nhạc).",
                    items: [
                        { id: '1a', text: "📚 Bài giảng Toán học", isCorrect: true },
                        { id: '1b', text: "🎬 Phim hoạt hình", isCorrect: true },
                        { id: '1c', text: "🍔 Đồ ăn thật để ăn ngay", isCorrect: false },
                        { id: '1d', text: "📰 Tin tức động vật", isCorrect: true }
                    ]
                },
                {
                    id: 2, type: "single-select",
                    title: "Màn 2: Hành Tinh Tri Thức",
                    desc: "Em muốn tìm thông tin về vũ trụ. Hãy chọn đúng thẻ tài liệu trả lời cho câu hỏi: 'Hành tinh nào có vành đai tuyệt đẹp?'",
                    hint: "Đó là một hành tinh rất to và có vành đai sáng bao quanh. Đó là Thổ Tinh!",
                    items: [
                        { id: '2a', text: "Thủy Tinh", isCorrect: false },
                        { id: '2b', text: "Kim Tinh", isCorrect: false },
                        { id: '2c', text: "Trái Đất", isCorrect: false },
                        { id: '2d', text: "Hỏa Tinh", isCorrect: false },
                        { id: '2e', text: "Mộc Tinh", isCorrect: false },
                        { id: '2f', text: "Thổ Tinh", isCorrect: true }
                    ]
                },
                {
                    id: 3, type: "scenario",
                    title: "Màn 3: Nên Mở Hay Không?",
                    desc: "Khi lướt web, em thấy các thông tin sau. Em sẽ làm gì? (Chọn hành động phù hợp cho mỗi dòng)",
                    hint: "Hãy đóng lại/hỏi người lớn nếu thấy thông tin lạ, giật gân, rùng rợn hoặc trúng thưởng.",
                    items: [
                        { id: '3a', text: "🎵 Video bài hát thiếu nhi học tiếng Anh", correctAction: "open" },
                        { id: '3b', text: "💰 Thông báo: 'Bạn đã trúng thưởng 1 Tỷ!'", correctAction: "ask" },
                        { id: '3c', text: "🧟 Video có hình ảnh bạo lực, đáng sợ", correctAction: "close" }
                    ]
                },
                {
                    id: 4, type: "classify",
                    title: "Màn 4: Người Hướng Dẫn",
                    desc: "Sắp xếp các hành động thành NÊN LÀM và TRÁNH LÀM để đảm bảo an toàn. (Nhấn chọn thẻ ở trên, rồi nhấn vào hộp bên dưới)",
                    hint: "Nên hỏi thầy cô/người lớn và xem trang web học tập. Tránh click quảng cáo lạ và xem phim không phù hợp.",
                    items: [
                        { id: '4a', text: "Hỏi người lớn khi gặp thông tin lạ", target: "nen" },
                        { id: '4b', text: "Nhấp vào quảng cáo trúng thưởng", target: "tranh" },
                        { id: '4c', text: "Vào trang web học tập đã được thầy cô giới thiệu", target: "nen" },
                        { id: '4d', text: "Tự ý xem phim kinh dị, bạo lực", target: "tranh" }
                    ]
                }
            ]
        };

        // --- AUDIO ENGINE (WEB AUDIO API ONLY) ---
        const AudioEngine = {
            ctx: null, bgmOn: true, sfxOn: true, bgmTimer: null, currentBgmNotes: [261.63, 329.63, 392.00, 329.63], noteIndex: 0,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            toggleBGM() {
                this.bgmOn = !this.bgmOn;
                const btn = document.getElementById('btn-bgm');
                btn.innerText = `🎵 Nhạc: ${this.bgmOn ? 'BẬT' : 'TẮT'}`;
                btn.className = this.bgmOn ? 'btn-bgm' : 'btn-bgm btn-off';
                if (!this.bgmOn) this.stopBGM(); else this.playBGM();
            },
            toggleSFX() {
                this.sfxOn = !this.sfxOn;
                const btn = document.getElementById('btn-sfx');
                btn.innerText = `🔊 Hiệu Ứng: ${this.sfxOn ? 'BẬT' : 'TẮT'}`;
                btn.className = this.sfxOn ? 'btn-sfx' : 'btn-sfx btn-off';
            },
            playBGM() {
                if (!this.bgmOn) return;
                this.init();
                this.stopBGM();
                const playNextNote = () => {
                    if (!this.bgmOn) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.value = this.currentBgmNotes[this.noteIndex];
                    this.noteIndex = (this.noteIndex + 1) % this.currentBgmNotes.length;
                    
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
                    
                    osc.start(this.ctx.currentTime); 
                    osc.stop(this.ctx.currentTime + 0.6);
                    this.bgmTimer = setTimeout(playNextNote, 600);
                };
                playNextNote();
            },
            stopBGM() { clearTimeout(this.bgmTimer); },
            playSFX(type) {
                if (!this.sfxOn) return;
                this.init();
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, t);
                    osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t); 
                    gain.gain.linearRampToValueAtTime(0, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, t); // A4
                    osc.frequency.setValueAtTime(554, t + 0.1); // C#5
                    osc.frequency.setValueAtTime(659, t + 0.2); // E5
                    gain.gain.setValueAtTime(0.1, t); 
                    gain.gain.linearRampToValueAtTime(0, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, t);
                    osc.frequency.linearRampToValueAtTime(150, t + 0.3);
                    gain.gain.setValueAtTime(0.15, t); 
                    gain.gain.linearRampToValueAtTime(0, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                } else if (type === 'win') {
                    osc.type = 'square';
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C5, E5, G5, C6
                        osc.frequency.setValueAtTime(freq, t + (i * 0.15));
                    });
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.8);
                    osc.start(t); osc.stop(t + 0.8);
                }
            }
        };

        // UI Event Listeners
        document.getElementById('btn-bgm').onclick = () => { AudioEngine.playSFX('click'); AudioEngine.toggleBGM(); };
        document.getElementById('btn-sfx').onclick = () => { AudioEngine.playSFX('click'); AudioEngine.toggleSFX(); };

        // --- GAME LOGIC ---
        let currentLevelIndex = 0;
        let score = 0;
        let levelScored = false; 
        
        // Level Specific States
        let multiSelectState = [];
        let scenarioState = {};
        let classifyActiveItem = null;
        let classifyState = { unassigned: [], nen: [], tranh: [] };

        function sayBip(text, exp='normal') {
            const b = document.getElementById('bip-bubble');
            b.innerText = text; 
            b.style.display = 'block';
            
            // Clear previous timeout if exists
            if(window.bipTimer) clearTimeout(window.bipTimer);
            window.bipTimer = setTimeout(() => b.style.display='none', 4000);
            
            const mouth = document.getElementById('bip-mouth');
            if(exp==='happy') mouth.setAttribute('d', 'M 35 40 Q 50 55 65 40');
            else if(exp==='sad') mouth.setAttribute('d', 'M 40 48 Q 50 40 60 48');
            else mouth.setAttribute('d', 'M 40 44 Q 50 46 60 44');
        }

        function startGame() {
            AudioEngine.playSFX('click');
            AudioEngine.playBGM();
            document.getElementById('screen-welcome').classList.remove('active');
            currentLevelIndex = 0; 
            score = 0;
            sayBip("Bắt đầu thôi! Cố lên nhé!", "happy");
            loadLevel();
        }

        function updateHUD() {
            document.getElementById('progress').innerText = `${Math.min(currentLevelIndex + 1, GAME_CONFIG.levels.length)}/${GAME_CONFIG.levels.length}`;
            document.getElementById('score').innerText = score;
        }

        function clearContainer() {
            const container = document.getElementById('game-screens');
            container.innerHTML = '';
            container.className = 'screen active';
        }

        function renderHeader(level) {
            const container = document.getElementById('game-screens');
            const title = document.createElement('h2');
            title.className = 'level-title';
            title.innerText = level.title;
            const desc = document.createElement('p');
            desc.className = 'level-desc';
            desc.innerText = level.desc;
            container.appendChild(title);
            container.appendChild(desc);
        }

        function createActionBar(onCheck) {
            const bar = document.createElement('div');
            bar.className = 'action-bar';
            
            const hintBtn = document.createElement('button');
            hintBtn.className = 'btn-action btn-hint';
            hintBtn.innerText = '💡 Gợi ý';
            hintBtn.onclick = () => {
                AudioEngine.playSFX('click');
                sayBip(GAME_CONFIG.levels[currentLevelIndex].hint, 'normal');
            };

            const checkBtn = document.createElement('button');
            checkBtn.className = 'btn-action btn-check';
            checkBtn.id = 'btn-check-current';
            checkBtn.innerText = '✓ Kiểm tra';
            if (onCheck) checkBtn.onclick = onCheck;

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-action btn-next';
            nextBtn.id = 'btn-next-level';
            nextBtn.innerText = 'Tiếp tục ➔';
            nextBtn.onclick = nextLevel;

            bar.appendChild(hintBtn);
            bar.appendChild(checkBtn);
            bar.appendChild(nextBtn);
            return bar;
        }

        function nextLevel() {
            AudioEngine.playSFX('click');
            currentLevelIndex++;
            loadLevel();
        }

        function markCompleted() {
            AudioEngine.playSFX('correct');
            sayBip("Tuyệt vời! Em làm đúng rồi!", "happy");
            if (!levelScored) {
                score += 25;
                levelScored = true;
                updateHUD();
            }
            document.getElementById('btn-check-current').style.display = 'none';
            document.getElementById('btn-next-level').style.display = 'block';
            
            // Disable interactions based on level type
            const cards = document.querySelectorAll('.card, .card-sm, .dnd-item, .btn-opt');
            cards.forEach(c => c.style.pointerEvents = 'none');
        }

        function loadLevel() {
            levelScored = false;
            if (currentLevelIndex >= GAME_CONFIG.levels.length) {
                showResult();
                return;
            }

            updateHUD();
            clearContainer();
            const level = GAME_CONFIG.levels[currentLevelIndex];
            renderHeader(level);
            
            const container = document.getElementById('game-screens');

            if (level.type === 'multi-select') {
                multiSelectState = [];
                const grid = document.createElement('div');
                grid.className = 'grid-4';
                level.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = item.text;
                    card.onclick = () => {
                        AudioEngine.playSFX('click');
                        card.classList.toggle('selected');
                        if (multiSelectState.includes(item.id)) {
                            multiSelectState = multiSelectState.filter(id => id !== item.id);
                        } else {
                            multiSelectState.push(item.id);
                        }
                    };
                    grid.appendChild(card);
                });
                container.appendChild(grid);

                container.appendChild(createActionBar(() => {
                    AudioEngine.playSFX('click');
                    const correctIds = level.items.filter(i => i.isCorrect).map(i => i.id);
                    if (multiSelectState.length === correctIds.length && multiSelectState.every(id => correctIds.includes(id))) {
                        markCompleted();
                    } else {
                        AudioEngine.playSFX('wrong');
                        sayBip("Chưa chính xác rồi. Hãy nhớ chọn đủ 3 thẻ đúng nhé!", "sad");
                    }
                }));

            } else if (level.type === 'single-select') {
                const grid = document.createElement('div');
                grid.className = 'grid-6';
                level.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card-sm';
                    card.innerText = item.text;
                    card.onclick = () => {
                        if(levelScored) return;
                        if (item.isCorrect) {
                            card.classList.add('correct-bg');
                            markCompleted();
                        } else {
                            AudioEngine.playSFX('wrong');
                            card.classList.add('wrong-bg');
                            setTimeout(() => card.classList.remove('wrong-bg'), 800);
                            sayBip("Không phải hành tinh này rồi, thử lại xem!", "sad");
                        }
                    };
                    grid.appendChild(card);
                });
                container.appendChild(grid);
                
                // For single select, check button is hidden, evaluate on click.
                const bar = createActionBar(null);
                bar.querySelector('#btn-check-current').style.display = 'none';
                container.appendChild(bar);

            } else if (level.type === 'scenario') {
                scenarioState = {};
                const wrap = document.createElement('div');
                wrap.className = 'scenario-container';
                level.items.forEach((item, index) => {
                    scenarioState[item.id] = null;
                    const row = document.createElement('div');
                    row.className = 'row-item';
                    
                    const text = document.createElement('div');
                    text.className = 'row-text';
                    text.innerText = item.text;
                    
                    const actions = document.createElement('div');
                    actions.className = 'row-actions';
                    
                    const opts = [
                        {val: 'open', label: 'Mở xem', cls: 'open'},
                        {val: 'ask', label: 'Hỏi người lớn', cls: 'ask'},
                        {val: 'close', label: 'Đóng lại', cls: 'close'}
                    ];
                    
                    opts.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = `btn-opt`;
                        btn.innerText = opt.label;
                        btn.onclick = () => {
                            AudioEngine.playSFX('click');
                            scenarioState[item.id] = opt.val;
                            Array.from(actions.children).forEach(b => b.className = 'btn-opt');
                            btn.className = `btn-opt selected ${opt.cls}`;
                        };
                        actions.appendChild(btn);
                    });
                    
                    row.appendChild(text);
                    row.appendChild(actions);
                    wrap.appendChild(row);
                });
                container.appendChild(wrap);

                container.appendChild(createActionBar(() => {
                    AudioEngine.playSFX('click');
                    let allAnswered = true;
                    let allCorrect = true;
                    level.items.forEach(item => {
                        if (!scenarioState[item.id]) allAnswered = false;
                        if (scenarioState[item.id] !== item.correctAction) allCorrect = false;
                    });
                    
                    if (!allAnswered) {
                        sayBip("Em chọn đủ hành động cho tất cả các mục nhé!", "normal");
                        return;
                    }
                    if (allCorrect) {
                        markCompleted();
                    } else {
                        AudioEngine.playSFX('wrong');
                        sayBip("Có lựa chọn chưa an toàn. Phim bạo lực nên Đóng, trúng thưởng lạ nên Hỏi người lớn!", "sad");
                    }
                }));

            } else if (level.type === 'classify') {
                classifyActiveItem = null;
                classifyState = { unassigned: [...level.items], nen: [], tranh: [] };
                
                const sourceDiv = document.createElement('div');
                sourceDiv.className = 'item-source';
                sourceDiv.id = 'source-bin';
                
                const renderItems = () => {
                    sourceDiv.innerHTML = '';
                    document.getElementById('bin-nen').innerHTML = '<div class="bin-title">👍 NÊN LÀM</div>';
                    document.getElementById('bin-tranh').innerHTML = '<div class="bin-title">🛑 TRÁNH LÀM</div>';
                    
                    ['unassigned', 'nen', 'tranh'].forEach(listName => {
                        const targetDOM = listName === 'unassigned' ? sourceDiv : document.getElementById(`bin-${listName}`);
                        classifyState[listName].forEach(item => {
                            const d = document.createElement('div');
                            d.className = 'dnd-item';
                            if (classifyActiveItem && classifyActiveItem.id === item.id) d.classList.add('active');
                            d.innerText = item.text;
                            d.onclick = (e) => {
                                e.stopPropagation();
                                if(levelScored) return;
                                AudioEngine.playSFX('click');
                                // If clicking an already active item, deselect it
                                if (classifyActiveItem && classifyActiveItem.id === item.id) {
                                    classifyActiveItem = null;
                                } else {
                                    classifyActiveItem = item;
                                    // If clicking item inside a bin, move it back to unassigned immediately
                                    if(listName !== 'unassigned') {
                                        classifyState[listName] = classifyState[listName].filter(i => i.id !== item.id);
                                        classifyState.unassigned.push(item);
                                        classifyActiveItem = null; // deselect after moving back
                                    }
                                }
                                renderItems();
                            };
                            targetDOM.appendChild(d);
                        });
                    });
                };

                const dndWrap = document.createElement('div');
                dndWrap.className = 'dnd-container';
                
                ['nen', 'tranh'].forEach(target => {
                    const bin = document.createElement('div');
                    bin.className = `bin ${target}-lam`;
                    bin.id = `bin-${target}`;
                    bin.onclick = () => {
                        if(levelScored) return;
                        if (classifyActiveItem) {
                            AudioEngine.playSFX('click');
                            // Remove from old lists
                            classifyState.unassigned = classifyState.unassigned.filter(i => i.id !== classifyActiveItem.id);
                            classifyState.nen = classifyState.nen.filter(i => i.id !== classifyActiveItem.id);
                            classifyState.tranh = classifyState.tranh.filter(i => i.id !== classifyActiveItem.id);
                            // Add to new list
                            classifyState[target].push(classifyActiveItem);
                            classifyActiveItem = null;
                            renderItems();
                        }
                    };
                    dndWrap.appendChild(bin);
                });

                container.appendChild(sourceDiv);
                container.appendChild(dndWrap);
                
                // Initial render
                setTimeout(() => renderItems(), 0);

                container.appendChild(createActionBar(() => {
                    AudioEngine.playSFX('click');
                    if (classifyState.unassigned.length > 0) {
                        sayBip("Hãy xếp hết các thẻ vào 2 cột trước khi kiểm tra nhé!", "normal");
                        return;
                    }
                    
                    let allCorrect = true;
                    classifyState.nen.forEach(i => { if(i.target !== 'nen') allCorrect = false; });
                    classifyState.tranh.forEach(i => { if(i.target !== 'tranh') allCorrect = false; });
                    
                    if (allCorrect) {
                        markCompleted();
                    } else {
                        AudioEngine.playSFX('wrong');
                        sayBip("Vẫn còn hành động sắp xếp nhầm cột. Em xem lại nhé!", "sad");
                    }
                }));
            }
        }

        function showResult() {
            clearContainer();
            const container = document.getElementById('game-screens');
            container.style.justifyContent = 'center';
            AudioEngine.playSFX('win');
            
            const title = document.createElement('h2');
            title.className = 'level-title';
            title.innerText = "CHÚC MỪNG EM ĐÃ HOÀN THÀNH!";
            
            const svg = document.createElement('div');
            svg.innerHTML = `
                <svg class="trophy-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#FFC65C" />
                    <path d="M20 30 Q50 80 80 30 Z" fill="#EF7469" />
                    <rect x="40" y="30" width="20" height="40" fill="#FFF" />
                    <text x="50" y="55" font-size="20" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">100</text>
                    <path d="M30 20 Q50 40 70 20 Z" fill="#53B77A" />
                </svg>
            `;
            
            const scoreText = document.createElement('div');
            scoreText.className = 'final-score';
            scoreText.innerText = `${score} ĐIỂM`;

            const msg = document.createElement('p');
            msg.className = 'level-desc';
            msg.innerText = "Em đã biết cách tìm kiếm thông tin an toàn trên Internet. Hãy luôn nhớ những kiến thức này nhé!";

            const btn = document.createElement('button');
            btn.className = 'btn-action btn-check';
            btn.innerText = '↺ Chơi Lại';
            btn.onclick = () => {
                AudioEngine.playSFX('click');
                currentLevelIndex = 0;
                score = 0;
                loadLevel();
            };

            container.appendChild(title);
            container.appendChild(svg);
            container.appendChild(scoreText);
            container.appendChild(msg);
            container.appendChild(btn);

            sayBip("Quá đỉnh! Em đã trở thành Thợ Săn Kho Báu Internet!", "happy");
            document.getElementById('progress').innerText = "Hoàn thành";
        }
    </script>
</body>
